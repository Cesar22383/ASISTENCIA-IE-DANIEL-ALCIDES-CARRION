<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Asistencia</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}

.contenedor {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

input, select, button {
    padding: 10px;
    font-size: 15px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.tabla {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
}

th {
    background: #e5e7eb;
}

.temprano {
    background: #b6f2b6;
    font-weight: bold;
}

.tardanza {
    background: #fff176;
    font-weight: bold;
}

.demasiado {
    background: #ff8a80;
    font-weight: bold;
}

.falto {
    background: #d0d0d0;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📊 Consulta de Asistencia</h1>

<div class="filtros">

<input
    type="text"
    id="buscar"
    placeholder="Nombre o DNI"
>

<select id="grado">
    <option value="">Todos los grados</option>
    <option value="Primero">Primero</option>
    <option value="Segundo">Segundo</option>
    <option value="Tercero">Tercero</option>
    <option value="Cuarto">Cuarto</option>
    <option value="Quinto">Quinto</option>
</select>

<select id="seccion">
    <option value="">Todas las secciones</option>
    <option value="A">A</option>
    <option value="B">B</option>
</select>

<label>
Desde
<input type="date" id="desde">
</label>

<label>
Hasta
<input type="date" id="hasta">
</label>

<select id="estado">
    <option value="">Todos los estados</option>
    <option value="TEMPRANO">TEMPRANO</option>
    <option value="TARDANZA">TARDANZA</option>
    <option value="DEMASIADO TARDE">DEMASIADO TARDE</option>
    <option value="FALTO">FALTO</option>
</select>

<button onclick="consultar()">
🔎 Consultar
</button>

<button onclick="descargar()">
📥 Descargar
</button>

</div>

<div id="resultado">
    Selecciona los filtros y pulsa <b>Consultar</b>.
</div>

</div>

<script>

const SUPABASE_URL =
"https://glgmttpaqheuvqplbjrl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MX3PWn17cZ3hF7JqtFXb9A_Ee0iw1Tb";

let datosActuales = [];

async function consultar() {

    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "⏳ Consultando asistencia...";

    try {

        const grado = document.getElementById("grado").value;
        const seccion = document.getElementById("seccion").value;
        const desde = document.getElementById("desde").value;
        const hasta = document.getElementById("hasta").value;
        const estadoFiltro = document.getElementById("estado").value;
        const buscar = document.getElementById("buscar").value.trim().toLowerCase();

        if (!grado || !seccion || !desde || !hasta) {

            resultado.innerHTML =
                "<p style='color:red'>⚠️ Selecciona grado, sección y las fechas.</p>";

            return;
        }

        let estudiantesUrl =
            SUPABASE_URL +
            "/rest/v1/estudiantes" +
            "?select=dni,nombre,grado,seccion,orden" +
            "&grado=eq." + encodeURIComponent(grado) +
            "&seccion=eq." + encodeURIComponent(seccion) +
            "&order=orden.asc";

        const respuestaEstudiantes = await fetch(
            estudiantesUrl,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!respuestaEstudiantes.ok) {

            const errorTexto =
                await respuestaEstudiantes.text();

            resultado.innerHTML =
                "<p style='color:red'><b>Error estudiantes:</b><br>" +
                errorTexto +
                "</p>";

            return;
        }

        const estudiantes =
            await respuestaEstudiantes.json();

        let asistenciaUrl =
            SUPABASE_URL +
            "/rest/v1/asistencia" +
            "?select=*" +
            "&fecha=gte." + encodeURIComponent(desde) +
            "&fecha=lte." + encodeURIComponent(hasta);

        const respuestaAsistencia = await fetch(
            asistenciaUrl,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!respuestaAsistencia.ok) {

            const errorTexto =
                await respuestaAsistencia.text();

            resultado.innerHTML =
                "<p style='color:red'><b>Error asistencia:</b><br>" +
                errorTexto +
                "</p>";

            return;
        }

        const asistencias =
            await respuestaAsistencia.json();

        let todosLosDatos = [];

        estudiantes.forEach(estudiante => {

            const registros =
                asistencias.filter(a =>
                    String(a.dni) === String(estudiante.dni)
                );

            if (registros.length === 0) {

                todosLosDatos.push({

                    grado: estudiante.grado,
                    seccion: estudiante.seccion,
                    orden: estudiante.orden,
                    nombre: estudiante.nombre,
                    dni: estudiante.dni,
                    fecha: desde,
                    dia: "",
                    hora: "",
                    estado: "FALTO"

                });

            } else {

                registros.forEach(registro => {

                    todosLosDatos.push({

                        grado: estudiante.grado,
                        seccion: estudiante.seccion,
                        orden: estudiante.orden,
                        nombre: estudiante.nombre,
                        dni: estudiante.dni,
                        fecha: registro.fecha,
                        dia: registro.dia,
                        hora: registro.hora,
                        estado: registro.estado

                    });

                });

            }

        });

        if (buscar) {

            todosLosDatos =
                todosLosDatos.filter(e =>
                    String(e.nombre || "")
                        .toLowerCase()
                        .includes(buscar) ||
                    String(e.dni || "")
                        .includes(buscar)
                );
        }

        if (estadoFiltro) {

            todosLosDatos =
                todosLosDatos.filter(
                    e => e.estado === estadoFiltro
                );
        }

        todosLosDatos.sort((a, b) => {

            if (a.fecha !== b.fecha) {
                return String(a.fecha)
                    .localeCompare(String(b.fecha));
            }

            return Number(a.orden || 0) -
                   Number(b.orden || 0);

        });

        datosActuales = todosLosDatos;

        mostrar(datosActuales);

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
            "<p style='color:red'><b>❌ Error:</b><br>" +
            error.message +
            "</p>";
    }
}

function mostrar(datos) {

    const resultado =
        document.getElementById("resultado");

    if (!datos.length) {

        resultado.innerHTML =
            "<p>❌ No se encontraron registros.</p>";

        return;
    }

    let html = `
    <div class="tabla">

    <table>

    <thead>

    <tr>
        <th>Grado</th>
        <th>Sección</th>
        <th>Orden</th>
        <th>Apellidos y nombres</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>
    `;

    datos.forEach(e => {

        let clase = "";

        if (e.estado === "TEMPRANO")
            clase = "temprano";

        if (e.estado === "TARDANZA")
            clase = "tardanza";

        if (e.estado === "DEMASIADO TARDE")
            clase = "demasiado";

        if (e.estado === "FALTO")
            clase = "falto";

        html += `
        <tr>

            <td>${e.grado ?? ""}</td>

            <td>${e.seccion ?? ""}</td>

            <td>${e.orden ?? ""}</td>

            <td>${e.nombre ?? ""}</td>

            <td>${e.dni ?? ""}</td>

            <td>${e.fecha ?? ""}</td>

            <td>${e.dia ?? ""}</td>

            <td>${e.hora ?? ""}</td>

            <td class="${clase}">
                ${e.estado ?? ""}
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>

    </div>

    <p>
        <b>Total:</b> ${datos.length} registros
    </p>
    `;

    resultado.innerHTML = html;
}

function descargar() {

    if (!datosActuales.length) {

        alert("Primero realiza una consulta.");

        return;
    }

    let csv =
        "Grado,Sección,Orden,Apellidos y nombres,DNI,Fecha,Día,Hora,Estado\n";

    datosActuales.forEach(e => {

        csv += [
            e.grado,
            e.seccion,
            e.orden,
            `"${e.nombre}"`,
            e.dni,
            e.fecha,
            e.dia,
            e.hora,
            e.estado
        ].join(",") + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "reporte_asistencia.csv";

    enlace.click();
}

</script>

</body>
</html>
