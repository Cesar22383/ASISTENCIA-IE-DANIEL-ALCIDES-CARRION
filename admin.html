<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Asistencia</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}
const asistencias =
    await respuesta.json();

let estudiantesUrl =
    SUPABASE_URL +
    "/rest/v1/estudiantes" +
    "?select=dni,nombre,grado,seccion,orden" +
    "&grado=eq." +
    encodeURIComponent(grado) +
    "&seccion=eq." +
    encodeURIComponent(seccion) +
    "&order=orden.asc";

const respuestaEstudiantes =
    await fetch(estudiantesUrl, {
        method: "GET",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
                "Bearer " + SUPABASE_KEY
        }
    });

if (!respuestaEstudiantes.ok) {

    const errorTexto =
        await respuestaEstudiantes.text();

    throw new Error(
        "Error al consultar estudiantes: " +
        errorTexto
    );
}

const estudiantes =
    await respuestaEstudiantes.json();

const ahora =
    new Date();

const horaActual =
    ahora.getHours() * 60 +
    ahora.getMinutes();

let datosCompletos = [];

estudiantes.forEach(estudiante => {

    const registro =
        asistencias.find(a =>
            String(a.dni).trim() ===
            String(estudiante.dni).trim()
        );

    if (registro) {

        datosCompletos.push({

            grado: estudiante.grado,
            seccion: estudiante.seccion,
            orden: estudiante.orden,
            nombre: estudiante.nombre,
            dni: estudiante.dni,
            fecha: registro.fecha,
            dia: registro.dia,
            hora: registro.hora,
            estado: registro.estado

        });

    } else {

        datosCompletos.push({

            grado: estudiante.grado,
            seccion: estudiante.seccion,
            orden: estudiante.orden,
            nombre: estudiante.nombre,
            dni: estudiante.dni,
            fecha: desde,
            dia: "",
            hora: "",
            estado:
                horaActual >= 660
                    ? "FALTO"
                    : "PENDIENTE"

        });

    }

});

if (buscar) {

    datosCompletos =
        datosCompletos.filter(e =>
            String(e.nombre || "")
                .toLowerCase()
                .includes(buscar.toLowerCase()) ||
            String(e.dni || "")
                .includes(buscar)
        );
}

if (estado) {

    datosCompletos =
        datosCompletos.filter(
            e => e.estado === estado
        );

}

datosActuales =
    datosCompletos;

mostrar(datosActuales);


datosActuales = datos;

mostrar(datosActuales);

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
            "<p style='color:red'><b>❌ Error:</b><br>" +
            error.message +
            "</p>";
    }
}

function mostrar(datos) {

    const resultado =
        document.getElementById("resultado");

    if (!datos.length) {

        resultado.innerHTML =
            "<p>❌ No se encontraron registros.</p>";

        return;
    }

    let html = `
    <div class="tabla">

    <table>

    <thead>

    <tr>
        <th>Grado</th>
        <th>Sección</th>
        <th>Orden</th>
        <th>Apellidos y nombres</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>
    `;

    datos.forEach(e => {

        let clase = "";

        if (e.estado === "TEMPRANO")
            clase = "temprano";

        if (e.estado === "TARDANZA")
            clase = "tardanza";

        if (e.estado === "DEMASIADO TARDE")
            clase = "demasiado";

        if (e.estado === "FALTO")
            clase = "falto";

        html += `
        <tr>

            <td>${e.grado ?? ""}</td>

            <td>${e.seccion ?? ""}</td>

            <td>${e.orden ?? ""}</td>

            <td>${e.nombre ?? ""}</td>

            <td>${e.dni ?? ""}</td>

            <td>${e.fecha ?? ""}</td>

            <td>${e.dia ?? ""}</td>

            <td>${e.hora ?? ""}</td>

            <td class="${clase}">
                ${e.estado ?? ""}
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>

    </div>

    <p>
        <b>Total:</b> ${datos.length} registros
    </p>
    `;

    resultado.innerHTML = html;
}

function descargar() {

    if (!datosActuales.length) {

        alert("Primero realiza una consulta.");

        return;
    }

    let csv =
        "Grado,Sección,Orden,Apellidos y nombres,DNI,Fecha,Día,Hora,Estado\n";

    datosActuales.forEach(e => {

        csv += [
            e.grado,
            e.seccion,
            e.orden,
            `"${e.nombre}"`,
            e.dni,
            e.fecha,
            e.dia,
            e.hora,
            e.estado
        ].join(",") + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "reporte_asistencia.csv";

    enlace.click();
}

</script>

</body>
</html>
