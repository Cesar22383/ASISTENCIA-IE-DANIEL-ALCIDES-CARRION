<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Asistencia</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}

.contenedor {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

input, select, button {
    padding: 10px;
    font-size: 15px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.tabla {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
}

th {
    background: #e5e7eb;
}

.temprano {
    background: #b6f2b6;
    font-weight: bold;
}

.tardanza {
    background: #fff176;
    font-weight: bold;
}

.demasiado {
    background: #ff8a80;
    font-weight: bold;
}

.falto {
    background: #d0d0d0;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📊 Consulta de Asistencia</h1>

<div class="filtros">

<input
    type="text"
    id="buscar"
    placeholder="Nombre o DNI"
>

<select id="grado">
    <option value="">Todos los grados</option>
    <option value="Primero">Primero</option>
    <option value="Segundo">Segundo</option>
    <option value="Tercero">Tercero</option>
    <option value="Cuarto">Cuarto</option>
    <option value="Quinto">Quinto</option>
</select>

<select id="seccion">
    <option value="">Todas las secciones</option>
    <option value="A">A</option>
    <option value="B">B</option>
</select>

<label>
Desde
<input type="date" id="desde">
</label>

<label>
Hasta
<input type="date" id="hasta">
</label>

<select id="estado">
    <option value="">Todos los estados</option>
    <option value="TEMPRANO">TEMPRANO</option>
    <option value="TARDANZA">TARDANZA</option>
    <option value="DEMASIADO TARDE">DEMASIADO TARDE</option>
    <option value="FALTO">FALTO</option>
</select>

<button onclick="consultar()">
🔎 Consultar
</button>

<button onclick="descargar()">
📥 Descargar
</button>

</div>

<div id="resultado">
    Selecciona los filtros y pulsa <b>Consultar</b>.
</div>

</div>

<script>

const SUPABASE_URL =
"https://glgmttpaqheuvqplbjrl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MX3PWni7cZ3hF7JqtFXb9A_Ee0iwIIb";

let datosActuales = [];

async function consultar() {
async function consultar() {


    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML =
        "⏳ Consultando asistencia...";

    try {

        const grado =
            document.getElementById("grado").value;

        const seccion =
            document.getElementById("seccion").value;

        const desde =
            document.getElementById("desde").value;

        const hasta =
            document.getElementById("hasta").value;

        const estado =
            document.getElementById("estado").value;

        const buscar =
            document.getElementById("buscar").value.trim();

        if (!grado || !seccion || !desde || !hasta) {

            resultado.innerHTML =
                "<p style='color:red'>⚠️ Selecciona grado, sección y las fechas.</p>";

            return;
        }

        let url =
            SUPABASE_URL +
            "/rest/v1/vista_asistencia?select=*";

        url +=
            "&grado=eq." +
            encodeURIComponent(grado);

        url +=
            "&seccion=eq." +
            encodeURIComponent(seccion);

        url +=
            "&fecha=gte." +
            encodeURIComponent(desde);

        url +=
            "&fecha=lte." +
            encodeURIComponent(hasta);


 if (buscar) {
    url +=
        "&dni=eq." +
        encodeURIComponent(buscar);
}
if (estado) {
    url +=
        "&estado=eq." +
        encodeURIComponent(estado);
}
        url +=
            "&order=orden.asc,fecha.desc,hora.desc";

        const respuesta =
            await fetch(url, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }

            });

        if (!respuesta.ok) {

            const errorTexto =
                await respuesta.text();

            resultado.innerHTML =
                "<p style='color:red'><b>❌ Error de Supabase:</b><br>" +
                errorTexto +
                "</p>";

            return;
        }

     const datos = await respuesta.json();
console.log("URL:", url);
console.log("DATOS:", datos);
/* Obtener todos los estudiantes del grado y sección */
let urlEstudiantes =
    SUPABASE_URL +
    "/rest/v1/estudiantes?select=*&grado=eq." +
    encodeURIComponent(grado) +
    "&seccion=eq." +
    encodeURIComponent(seccion) +
    "&order=orden.asc";

const respuestaEstudiantes = await fetch(urlEstudiantes, {
    method: "GET",
    headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
    }
});

const estudiantes = await respuestaEstudiantes.json();
const estudiantesMostrar = buscar
    ? estudiantes.filter(estudiante =>
        String(estudiante.dni) === String(buscar)
      )
    : estudiantes;
/* Crear una lista con las fechas seleccionadas */
let fechas = [];
let fechaActual = new Date(desde + "T00:00:00");
let fechaFinal = new Date(hasta + "T00:00:00");

while (fechaActual <= fechaFinal) {
    fechas.push(fechaActual.toISOString().split("T")[0]);
    fechaActual.setDate(fechaActual.getDate() + 1);
}
/* Agregar FALTO solo cuando se consulta ese estado */

    fechas.forEach(fecha => {

        estudiantesMostrar.forEach(estudiante => {

           const tieneRegistro = datos.some(mi =>
    mi.dni === estudiante.dni &&
    mi.fecha.substring(0, 10) === fecha
);
            );

            if (!tieneRegistro) {

                const fechaObj = new Date(fecha + "T00:00:00");

                const dias = [
                    "domingo",
                    "lunes",
                    "martes",
                    "miércoles",
                    "jueves",
                    "viernes",
                    "sábado"
                ];

                datos.push({
                    grado: estudiante.grado,
                    seccion: estudiante.seccion,
                    orden: estudiante.orden,
                    nombre: estudiante.nombre,
                    dni: estudiante.dni,
                    fecha: fecha,
                    dia: dias[fechaObj.getDay()],
                    hora: "",
                    estado: "FALTO"
                });
            }
        });
    });
/* Ordenar los resultados */
datos.sort((a, b) => {
    return String(a.fecha).localeCompare(String(b.fecha)) ||
           Number(a.orden || 0) - Number(b.orden || 0);
});

const datosFiltrados = estado
    ? datos.filter(e => e.estado === estado)
    : datos;

datosActuales = datosFiltrados;

mostrar(datosActuales);

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
            "<p style='color:red'><b>❌ Error:</b><br>" +
            error.message +
            "</p>";
    }
}

function mostrar(datos) {

    const resultado =
        document.getElementById("resultado");

    if (!datos.length) {

        resultado.innerHTML =
            "<p>❌ No se encontraron registros.</p>";

        return;
    }

    let html = `
    <div class="tabla">

    <table>

    <thead>

    <tr>
        <th>Grado</th>
        <th>Sección</th>
        <th>Orden</th>
        <th>Apellidos y nombres</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>
    `;

    datos.forEach(e => {

        let clase = "";

        if (e.estado === "TEMPRANO")
            clase = "temprano";

        if (e.estado === "TARDANZA")
            clase = "tardanza";

        if (e.estado === "DEMASIADO TARDE")
            clase = "demasiado";

        if (e.estado === "FALTO")
            clase = "falto";

        html += `
        <tr>

            <td>${e.grado ?? ""}</td>

            <td>${e.seccion ?? ""}</td>

            <td>${e.orden ?? ""}</td>

            <td>${e.nombre ?? ""}</td>

            <td>${e.dni ?? ""}</td>

            <td>${e.fecha ?? ""}</td>

            <td>${e.dia ?? ""}</td>

            <td>${e.hora ?? ""}</td>

            <td class="${clase}">
                ${e.estado ?? ""}
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>

    </div>

    <p>
        <b>Total:</b> ${datos.length} registros
    </p>
    `;

    resultado.innerHTML = html;
}

function descargar() {

    if (!datosActuales.length) {

        alert("Primero realiza una consulta.");

        return;
    }

    let csv =
        "Grado,Sección,Orden,Apellidos y nombres,DNI,Fecha,Día,Hora,Estado\n";

    datosActuales.forEach(e => {

        csv += [
            e.grado,
            e.seccion,
            e.orden,
            `"${e.nombre}"`,
            e.dni,
            e.fecha,
            e.dia,
            e.hora,
            e.estado
        ].join(",") + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "reporte_asistencia.csv";

    enlace.click();
}

</script>

</body>
</html>
