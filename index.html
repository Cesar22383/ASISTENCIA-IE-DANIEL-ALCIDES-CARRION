<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>I.E. Daniel Alcides Carrión</title>

<style>

* {
box-sizing: border-box;
}

html, body {

margin: 0;
padding: 0;

width: 100%;
height: 100%;

overflow: hidden;

font-family: Arial, sans-serif;

background: #4a86e8;

}

.pantalla {

width: 100%;
height: 100vh;

display: flex;

.titulo {

.datos {

}

.encontrado {

}

.error {

}

.cargando {

font-size: 25px;

margin-top: 25px;

}

@media (max-width: 700px) {

font-size: 28px;

margin-bottom: 30px;

}

.dni-label {

font-size: 26px;

}

#dni {

width: 300px;

height: 65px;

font-size: 32px;

}

.nombre {

</head>


<body>

<div class="pantalla">

    <div id="inicio">

        <div class="titulo">
            I.E. DANIEL ALCIDES CARRIÓN
        </div>

        <div class="dni-label">
            DNI
        </div>

        <input
            id="dni"
            type="tel"
            inputmode="numeric"
            maxlength="8"
            autocomplete="off"
            autofocus
            placeholder="Ingrese DNI"
        >

        <div
            id="cargando"
            class="cargando">
        </div>

    </div>


    <!-- RESULTADO DEL ESTUDIANTE -->
    <div id="resultado">

        <div
            id="nombre"
            class="nombre">
        </div>

        <div class="datos">
            <span id="grado"></span>
            <span id="seccion"></span>
        </div>

        <div class="datos">
            <span id="fecha"></span>
            <span id="dia"></span>
            <span id="hora"></span>
        </div>

        <div class="datos">
            <span id="estado"></span>
        </div>

        <div
            id="mensaje"
            class="mensaje">
        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://glgmttpaqheuvqplbjrl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MX3PWni7cZ3hF7JqtFXb9A_Ee0iwIIb";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const dniInput =
document.getElementById("dni");

const cargando =
document.getElementById("cargando");

const inicio =
document.getElementById("inicio");

const resultado =
document.getElementById("resultado");

const nombre =
document.getElementById("nombre");

const grado =
document.getElementById("grado");

const seccion =
document.getElementById("seccion");

const fechaElemento =
document.getElementById("fecha");

const diaElemento =
document.getElementById("dia");

const horaElemento =
document.getElementById("hora");

const estadoElemento =
document.getElementById("estado");

const mensajeElemento =
document.getElementById("mensaje");


/* =====================================================
   DETECTAR ENTER
   ===================================================== */

dniInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        const dni = dniInput.value.trim();

        if (dni.length === 8) {

            buscarEstudiante(dni);

        }

    }

});


/* =====================================================
   BUSCAR ESTUDIANTE
   ===================================================== */

async function buscarEstudiante(dni) {

    cargando.innerText =
    "Consultando...";

    try {

        const respuesta =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/estudiantes" +
            "?select=dni,nombre,grado,seccion" +
            "&dni=eq." +
            encodeURIComponent(dni),

            {
                method: "GET",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const datos =
        await respuesta.json();


        cargando.innerText = "";


        if (!datos || datos.length === 0) {

            mostrarNoEncontrado();

            return;

        }


        /*
           EL ESTUDIANTE EXISTE.
           AHORA REGISTRAMOS SU ASISTENCIA.
        */

        await registrarAsistencia(
            datos[0]
        );

    }

    catch (error) {

        console.error(error);

        cargando.innerText = "";

        mostrarError();

    }

}


/* =====================================================
   REGISTRAR ASISTENCIA
   ===================================================== */

async function registrarAsistencia(estudiante) {

    try {

        const ahora =
        new Date();


        /*
           FECHA Y HORA DE PERÚ
        */

        const fechaPeru =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "America/Lima",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).format(ahora);


        const horaPeru =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone: "America/Lima",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        ).format(ahora);


        /*
           DÍA DE LA SEMANA
        */

        const diaPeru =
        new Intl.DateTimeFormat(
            "es-PE",
            {
                timeZone: "America/Lima",
                weekday: "long"
            }
        ).format(ahora);


        /*
           DATOS QUE SE GUARDARÁN
        */

        let estado;
        let mensaje;
        let color;


        const partesHora =
        horaPeru.split(":");

        const hora =
        Number(partesHora[0]);

        const minuto =
        Number(partesHora[1]);

        const segundo =
        Number(partesHora[2]);


        const segundosActuales =
            hora * 3600 +
            minuto * 60 +
            segundo;


        const inicioTemprano =
            7 * 3600 +
            10 * 60;


        const inicioTardanza =
            7 * 3600 +
            31 * 60;


        const inicioDemasiadoTarde =
            7 * 3600 +
            36 * 60;


        /*
           🟢 TEMPRANO
           07:10:00 - 07:30:59
        */

        if (
            segundosActuales >= inicioTemprano &&
            segundosActuales < inicioTardanza
        ) {

            estado =
            "TEMPRANO";

            mensaje =
                "😊 ¡FELICITACIONES!\n" +
                "¡Llegaste temprano! ¡Excelente comienzo, sigue así!";

            color =
            "#00A651";

        }


        /*
           🟡 TARDANZA
           07:31:00 - 07:35:59
        */

        else if (
            segundosActuales >= inicioTardanza &&
            segundosActuales < inicioDemasiadoTarde
        ) {

            estado =
            "TARDANZA";

            mensaje =
                "😐 ¡TÚ PUEDES!\n" +
                "Hoy llegaste un poquito tarde. ¡Mañana puedes mejorar tu puntualidad!";

            color =
            "#F9AB00";

        }


        /*
           🔴 DEMASIADO TARDE
           07:36:00 EN ADELANTE
        */

        else if (
            segundosActuales >= inicioDemasiadoTarde
        ) {

            estado =
            "DEMASIADO TARDE";

            mensaje =
                "😔 ¡NO TE RINDAS!\n" +
                "Hoy llegaste tarde, pero mañana tienes una nueva oportunidad para llegar más temprano. ¡Tú puedes!";

            color =
            "#D93025";

        }


        /*
           ANTES DE LAS 07:10
        */

        else {

            estado =
            "TEMPRANO";

            mensaje =
                "😊 ¡EXCELENTE!\n" +
                "Llegaste antes de la hora. ¡Sigue así!";

            color =
            "#00A651";

        }


        /*
           DATOS QUE SE GUARDARÁN
        */

        const registro = {

            dni:
            estudiante.dni,

            fecha:
            fechaPeru,

            dia:
            diaPeru,

            hora:
            horaPeru,

            estado:
            estado

        };


        /*
           INSERTAR EN SUPABASE
        */

        const respuesta =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/asistencia",

            {

                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=minimal"

                },

                body:
                JSON.stringify(registro)

            }

        );


        if (!respuesta.ok) {

            const errorTexto =
            await respuesta.text();

            console.error(
                "Error al registrar:",
                errorTexto
            );


            if (
                respuesta.status === 409 ||
                errorTexto.includes("23505")
            ) {

                alert(
                    "Este estudiante ya registró su asistencia hoy."
                );

                return;

            }


            throw new Error(
                "NO SE PUDO REGISTRAR"
            );

        }


        /*
           MOSTRAR RESULTADO
        */

        mostrarEstudiante(
            estudiante,
            fechaPeru,
            diaPeru,
            horaPeru,
            estado,
            mensaje,
            color
        );

    }

    catch (error) {

        console.error(
            "Error al registrar asistencia:",
            error
        );

        throw error;

    }

}


/* =====================================================
   MOSTRAR ESTUDIANTE Y ASISTENCIA
   ===================================================== */

function mostrarEstudiante(
    estudiante,
    fecha,
    dia,
    hora,
    estadoTexto,
    mensajeTexto,
    color
) {

    inicio.style.display =
    "none";

    resultado.style.display =
    "block";


    nombre.innerText =
    estudiante.nombre || "";


    grado.innerText =
    estudiante.grado
    ? "Grado: " +
      estudiante.grado
    : "";


    seccion.innerText =
    estudiante.seccion
    ? "Sección: " +
      estudiante.seccion
    : "";


    fechaElemento.innerText =
    "Fecha: " +
    fecha;


    diaElemento.innerText =
    "Día: " +
    dia;


    horaElemento.innerText =
    "Hora: " +
    hora;


    estadoElemento.innerText =
    "Estado: " +
    estadoTexto;


    /*
       PINTAR TODO EL MENSAJE
    */

    mensajeElemento.className =
    "mensaje";


    mensajeElemento.style.backgroundColor =
    color;


    mensajeElemento.style.color =
    "#ffffff";


    mensajeElemento.innerText =
    mensajeTexto;


    /*
       MOSTRAR 1 SEGUNDO
       Y VOLVER AL INICIO
    */

    setTimeout(
        regresarInicio,
        1000
    );

}


/* =====================================================
   DNI NO ENCONTRADO
   ===================================================== */

function mostrarNoEncontrado() {

    inicio.style.display =
    "none";

    resultado.style.display =
    "block";


    nombre.innerText =
    "DNI NO ENCONTRADO";


    grado.innerText =
    "";

    seccion.innerText =
    "";


    fechaElemento.innerText =
    "";

    diaElemento.innerText =
    "";

    horaElemento.innerText =
    "";

    estadoElemento.innerText =
    "";


    mensajeElemento.className =
    "mensaje error";


    mensajeElemento.innerText =
    "Verifique el DNI";


    setTimeout(
        regresarInicio,
        1000
    );

}


/* =====================================================
   ERROR
   ===================================================== */

function mostrarError() {

    inicio.style.display =
    "none";

    resultado.style.display =
    "block";


    nombre.innerText =
    "ERROR";


    grado.innerText =
    "";

    seccion.innerText =
    "";


    fechaElemento.innerText =
    "";

    diaElemento.innerText =
    "";

    horaElemento.innerText =
    "";

    estadoElemento.innerText =
    "";


    mensajeElemento.className =
    "mensaje error";


    mensajeElemento.innerText =
    "No se pudo registrar la asistencia";


    setTimeout(
        regresarInicio,
        1000
    );

}


/* =====================================================
   VOLVER AL INICIO
   ===================================================== */

function regresarInicio() {

    resultado.style.display =
    "none";

    inicio.style.display =
    "block";


    dniInput.value =
    "";

    dniInput.focus();

}
async function consultarAsistencia() {
    const resultado = document.getElementById("resultadoConsulta");

    resultado.innerHTML = "⏳ Consultando...";

    try {
        const respuesta = await fetch(
            SUPABASE_URL +
            "/rest/v1/vista_asistencia?select=*&order=grado.asc,seccion.asc,orden.asc,fecha.desc",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!respuesta.ok) {
            throw new Error("No se pudo consultar Supabase");
        }

        const datos = await respuesta.json();

        resultado.innerHTML =
            "<p><b>Registros encontrados:</b> " +
            datos.length +
            "</p>";

    } catch (error) {
        console.error(error);
        resultado.innerHTML =
            "<p style='color:red;'>❌ Error al consultar.</p>";
    }
}
</script>

</div>
