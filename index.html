<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>I.E. Daniel Alcides Carrión</title>

<style>

* {
box-sizing: border-box;
}

html, body {

margin: 0;
padding: 0;

width: 100%;
height: 100%;

overflow: hidden;

font-family: Arial, sans-serif;

background: #4a86e8;

}

.pantalla {

width: 100%;
height: 100vh;

display: flex;
flex-direction: column;

align-items: center;
justify-content: center;

padding: 20px;

text-align: center;

}

.titulo {

color: white;

font-size: 42px;

font-weight: bold;

margin-bottom: 45px;

}

.dni-label {

color: white;

font-size: 32px;

font-weight: bold;

margin-bottom: 15px;

}

#dni {

width: 350px;

max-width: 90vw;

height: 70px;

border: 5px solid white;

border-radius: 12px;

background: white;

color: #222;

font-size: 38px;

font-weight: bold;

text-align: center;

outline: none;

}

#dni:focus {

border-color: #ffd966;

box-shadow: 0 0 20px #ffd966;

}

#resultado {

width: 90%;

max-width: 850px;

margin-top: 35px;

color: white;

display: none;

}

.nombre {

font-size: 32px;

font-weight: bold;

margin-bottom: 20px;

}

.datos {

display: flex;

justify-content: space-between;

font-size: 25px;

font-weight: bold;

margin: 10px 0;

}

.mensaje {

width: 100%;

margin-top: 25px;

padding: 18px;

border-radius: 5px;

color: white;

font-size: 30px;

font-weight: bold;

}

.encontrado {

background: #00a651;

}

.error {

background: #555;

}

.cargando {

color: white;

font-size: 25px;

font-weight: bold;

margin-top: 25px;

}

@media (max-width: 700px) {

.titulo {

font-size: 28px;

margin-bottom: 30px;

}

.dni-label {

font-size: 26px;

}

#dni {

width: 300px;

height: 65px;

font-size: 32px;

}

.nombre {

font-size: 25px;

}

.datos {

font-size: 20px;

}

.mensaje {

font-size: 22px;

}

}

</style>

</head>


<body>

<div class="pantalla">

<div id="inicio">

<div class="titulo">

I.E. DANIEL ALCIDES CARRIÓN

</div>

<div class="dni-label">

DNI

</div>

<input
id="dni"
type="tel"
inputmode="numeric"
maxlength="8"
autocomplete="off"
autofocus
placeholder="Ingrese DNI"
>

<div
id="cargando"
class="cargando">
</div>

</div>


<div id="resultado">

<div
id="nombre"
class="nombre">
</div>

<div class="datos">

<span id="grado"></span>

<span id="seccion"></span>

</div>

<div
id="mensaje"
class="mensaje">
</div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://glgmttpaqheuvqplbjrl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MX3PWni7cZ3hF7JqtFXb9A_Ee0iwIIb";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const dniInput =
document.getElementById("dni");

const cargando =
document.getElementById("cargando");

const inicio =
document.getElementById("inicio");

const resultado =
document.getElementById("resultado");

const nombre =
document.getElementById("nombre");

const grado =
document.getElementById("grado");

const seccion =
document.getElementById("seccion");

const mensaje =
document.getElementById("mensaje");


/* =====================================================
   DETECTAR ENTER
   ===================================================== */

dniInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        const dni = dniInput.value.trim();

        if (dni.length === 8) {

            buscarEstudiante(dni);

        }

    }

});





/* =====================================================
   BUSCAR ESTUDIANTE
   ===================================================== */

async function buscarEstudiante(dni) {

cargando.innerText =
"Consultando...";

try {

const respuesta =
await fetch(

SUPABASE_URL +
"/rest/v1/estudiantes" +
"?select=dni,nombre,grado,seccion" +
"&dni=eq." +
encodeURIComponent(dni),

{

method: "GET",

headers: {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);


if (!respuesta.ok) {

throw new Error(
"Error HTTP " +
respuesta.status
);

}


const datos =
await respuesta.json();


cargando.innerText = "";


if (!datos || datos.length === 0) {

mostrarNoEncontrado();

return;

}


/*
   EL ESTUDIANTE EXISTE.
   AHORA REGISTRAMOS SU ASISTENCIA.
*/

await registrarAsistencia(
datos[0]
);

}

catch (error) {

console.error(error);

cargando.innerText = "";

mostrarError();

}

}


/* =====================================================
   REGISTRAR ASISTENCIA
   ===================================================== */

async function registrarAsistencia(estudiante) {

try {

const ahora =
new Date();


/*
   FECHA Y HORA DE PERÚ
*/

const fechaPeru =
new Intl.DateTimeFormat(
"en-CA",
{
timeZone: "America/Lima",
year: "numeric",
month: "2-digit",
day: "2-digit"
}
).format(ahora);


const horaPeru =
new Intl.DateTimeFormat(
"en-GB",
{
timeZone: "America/Lima",
hour: "2-digit",
minute: "2-digit",
second: "2-digit",
hour12: false
}
).format(ahora);


/*
   DÍA DE LA SEMANA
*/

const diaPeru =
new Intl.DateTimeFormat(
"es-PE",
{
timeZone: "America/Lima",
weekday: "long"
}
).format(ahora);


/*
   DATOS QUE SE GUARDARÁN
*/

const registro = {

dni: estudiante.dni,

fecha: fechaPeru,

dia: diaPeru,

hora: horaPeru,

estado: "PRESENTE"

};


/*
   INSERTAR EN SUPABASE
*/

const respuesta =
await fetch(

SUPABASE_URL +
"/rest/v1/asistencia",

{

method: "POST",

headers: {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify(registro)

}

);


if (!respuesta.ok) {

    const errorTexto =
    await respuesta.text();

    console.error(
        "Error al registrar:",
        errorTexto
    );

    if (
        respuesta.status === 409 ||
        errorTexto.includes("23505")
    ) {

        alert(
            "Este estudiante ya registró su asistencia hoy."
        );

        return;
    }

    throw new Error(
        "NO SE PUDO REGISTRAR"
    );
}


/*
   MOSTRAR RESULTADO
*/

mostrarEstudiante(
estudiante,
fechaPeru,
horaPeru
); } catch (error) {

    console.error("Error al registrar asistencia:", error);

    throw error;

}

}


/* =====================================================
   MOSTRAR ESTUDIANTE Y ASISTENCIA
   ===================================================== */

function mostrarEstudiante(
estudiante,
fecha,
hora
) {

inicio.style.display =
"none";

resultado.style.display =
"block";


nombre.innerText =
estudiante.nombre || "";


grado.innerText =
estudiante.grado
? "Grado: " +
estudiante.grado
: "";


seccion.innerText =
estudiante.seccion
? "Sección: " +
estudiante.seccion
: "";


mensaje.className =
"mensaje encontrado";


mensaje.innerText =
"ASISTENCIA REGISTRADA";


setTimeout(
regresarInicio,
1000
);

}


/* =====================================================
   DNI NO ENCONTRADO
   ===================================================== */

function mostrarNoEncontrado() {

inicio.style.display =
"none";

resultado.style.display =
"block";


nombre.innerText =
"DNI NO ENCONTRADO";


grado.innerText = "";

seccion.innerText = "";


mensaje.className =
"mensaje error";


mensaje.innerText =
"Verifique el DNI";


setTimeout(
regresarInicio,
1000
);

}


/* =====================================================
   ERROR
   ===================================================== */

function mostrarError() {

inicio.style.display =
"none";

resultado.style.display =
"block";


nombre.innerText =
"ERROR";


grado.innerText = "";

seccion.innerText = "";


mensaje.className =
"mensaje error";


mensaje.innerText =
"No se pudo registrar la asistencia";


setTimeout(
regresarInicio,
1000
);

}


/* =====================================================
   VOLVER AL INICIO
   ===================================================== */

function regresarInicio() {

resultado.style.display =
"none";

inicio.style.display =
"block";

dniInput.value =
"";

dniInput.focus();

}

</script>

</body>

</html>
