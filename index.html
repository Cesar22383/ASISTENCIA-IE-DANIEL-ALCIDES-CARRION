<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>I.E. Daniel Alcides Carrión</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #4a86e8;
    }

    .pantalla {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;
    }

    .titulo {
      color: white;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 45px;
    }

    .dni-label {
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #dni {

      width: 350px;
      max-width: 90vw;

      height: 70px;

      border: 5px solid white;
      border-radius: 12px;

      background: white;
      color: #222;

      font-size: 38px;
      font-weight: bold;

      text-align: center;

      outline: none;
    }

    #dni:focus {

      border-color: #ffd966;

      box-shadow:
        0 0 20px #ffd966;
    }

    #resultado {

      width: 90%;
      max-width: 850px;

      margin-top: 35px;

      color: white;

      display: none;
    }

    .nombre {

      font-size: 32px;
      font-weight: bold;

      margin-bottom: 20px;
    }

    .datos {

      display: flex;

      justify-content: space-between;

      font-size: 25px;
      font-weight: bold;

      margin: 10px 0;
    }

    .mensaje {

      width: 100%;

      margin-top: 25px;

      padding: 18px;

      border-radius: 5px;

      color: white;

      font-size: 30px;
      font-weight: bold;
    }

    .encontrado {
      background: #00a651;
    }

    .error {
      background: #555;
    }

    .cargando {

      color: white;

      font-size: 25px;
      font-weight: bold;

      margin-top: 25px;
    }

    @media (max-width: 700px) {

      .titulo {
        font-size: 28px;
        margin-bottom: 30px;
      }

      .dni-label {
        font-size: 26px;
      }

      #dni {

        width: 300px;
        height: 65px;

        font-size: 32px;
      }

      .nombre {
        font-size: 25px;
      }

      .datos {
        font-size: 20px;
      }

      .mensaje {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>

  <div class="pantalla">

    <div id="inicio">

      <div class="titulo">
        I.E. DANIEL ALCIDES CARRIÓN
      </div>

      <div class="dni-label">
        DNI
      </div>

      <input
        id="dni"
        type="tel"
        inputmode="numeric"
        maxlength="8"
        autocomplete="off"
        autofocus
        placeholder="Ingrese DNI"
      >

      <div
        id="cargando"
        class="cargando">
      </div>

    </div>


    <div id="resultado">

      <div
        id="nombre"
        class="nombre">
      </div>

      <div class="datos">

        <span id="grado"></span>

        <span id="seccion"></span>

      </div>

      <div
        id="mensaje"
        class="mensaje">
      </div>

    </div>

  </div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://glgmttpaqheuvqplbjrl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MX3PWni7cZ3hF7JqtFXb9A_Ee0iwIIb";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const dniInput =
document.getElementById("dni");

const cargando =
document.getElementById("cargando");

const inicio =
document.getElementById("inicio");

const resultado =
document.getElementById("resultado");

const nombre =
document.getElementById("nombre");

const grado =
document.getElementById("grado");

const seccion =
document.getElementById("seccion");

const mensaje =
document.getElementById("mensaje");


/* =====================================================
   CONTROL PARA EVITAR CONSULTAS REPETIDAS
   ===================================================== */

let ultimaConsulta = "";

let consultando = false;


/* =====================================================
   BUSCAR AUTOMÁTICAMENTE AL COMPLETAR LOS 8 DÍGITOS
   ===================================================== */

dniInput.addEventListener(
  "input",
  function() {

    /* Dejar solamente números */

    this.value =
      this.value.replace(/\D/g, "");


    const dni =
      this.value.trim();


    /* Solo consultar cuando tenga exactamente 8 dígitos */

    if (
      dni.length === 8 &&
      dni !== ultimaConsulta &&
      !consultando
    ) {

      ultimaConsulta = dni;

      buscarEstudiante(dni);

    }

  }
);


/* =====================================================
   TAMBIÉN PERMITIR ENTER
   ===================================================== */

dniInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      const dni =
        dniInput.value.trim();


      if (
        dni.length === 8 &&
        !consultando
      ) {

        ultimaConsulta = dni;

        buscarEstudiante(dni);

      }

    }

  }
);


/* =====================================================
   BUSCAR ESTUDIANTE EN SUPABASE
   ===================================================== */

async function buscarEstudiante(dni) {

  consultando = true;

  cargando.innerText =
    "Consultando...";


  const inicioTiempo =
    performance.now();


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/estudiantes" +
      "?select=dni,nombre,grado,seccion" +
      "&dni=eq." +
      encodeURIComponent(dni);


    console.log(
      "Consultando:",
      url
    );


    const respuesta =
      await fetch(
        url,
        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          }

        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "Error HTTP " +
        respuesta.status
      );

    }


    const datos =
      await respuesta.json();


    const finTiempo =
      performance.now();


    console.log(
      "Tiempo de consulta:",
      Math.round(
        finTiempo -
        inicioTiempo
      ),
      "ms"
    );


    console.log(
      "Datos recibidos:",
      datos
    );


    cargando.innerText =
      "";


    if (
      !datos ||
      datos.length === 0
    ) {

      mostrarNoEncontrado();

      return;

    }


    mostrarEstudiante(
      datos[0]
    );


  }

  catch (error) {

    console.error(
      "ERROR:",
      error
    );


    cargando.innerText =
      "";


    mostrarError();

  }

  finally {

    consultando =
      false;

  }

}


/* =====================================================
   MOSTRAR ESTUDIANTE ENCONTRADO
   ===================================================== */

function mostrarEstudiante(
  datos
) {

  inicio.style.display =
    "none";


  resultado.style.display =
    "block";


  nombre.innerText =
    datos.nombre || "";


  grado.innerText =
    datos.grado
      ? "Grado: " +
        datos.grado
      : "";


  seccion.innerText =
    datos.seccion
      ? "Sección: " +
        datos.seccion
      : "";


  mensaje.className =
    "mensaje encontrado";


  mensaje.innerText =
    "ESTUDIANTE ENCONTRADO";


  /* Regresar automáticamente */

  setTimeout(
    regresarInicio,
    1500
  );

}


/* =====================================================
   DNI NO ENCONTRADO
   ===================================================== */

function mostrarNoEncontrado() {

  inicio.style.display =
    "none";


  resultado.style.display =
    "block";


  nombre.innerText =
    "DNI NO ENCONTRADO";


  grado.innerText =
    "";


  seccion.innerText =
    "";


  mensaje.className =
    "mensaje error";


  mensaje.innerText =
    "Verifique el DNI";


  setTimeout(
    regresarInicio,
    1500
  );

}


/* =====================================================
   ERROR DE CONEXIÓN
   ===================================================== */

function mostrarError() {

  inicio.style.display =
    "none";


  resultado.style.display =
    "block";


  nombre.innerText =
    "ERROR DE CONEXIÓN";


  grado.innerText =
    "";


  seccion.innerText =
    "";


  mensaje.className =
    "mensaje error";


  mensaje.innerText =
    "No se pudo consultar la base de datos";


  setTimeout(
    regresarInicio,
    2000
  );

}


/* =====================================================
   REGRESAR AL INICIO
   ===================================================== */

function regresarInicio() {

  resultado.style.display =
    "none";


  inicio.style.display =
    "block";


  dniInput.value =
    "";


  ultimaConsulta =
    "";


  consultando =
    false;


  cargando.innerText =
    "";


  dniInput.focus();

}


/* =====================================================
   ENFOCAR EL DNI AL CARGAR LA PÁGINA
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    dniInput.focus();

  }
);

</script>

</body>

</html>
