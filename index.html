<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>I.E. Daniel Alcides Carrión</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #4a86e8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      width: 95%;
      max-width: 700px;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 40px;
    }

    label {
      display: block;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    input {
      width: 350px;
      max-width: 90%;
      height: 70px;
      border: 4px solid white;
      border-radius: 12px;
      font-size: 36px;
      text-align: center;
      font-weight: bold;
      outline: none;
    }

    input:focus {
      border-color: #ffd966;
    }

    #mensaje {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <h1>I.E. DANIEL ALCIDES CARRIÓN</h1>

    <h2>CONTROL DE ASISTENCIA</h2>

    <label for="dni">DNI</label>

    <input
      id="dni"
      type="tel"
      inputmode="numeric"
      maxlength="8"
      placeholder="Ingrese DNI"
      autofocus
    >

    <div id="mensaje"></div>

  </div>

</body>

</html>
