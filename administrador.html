        "FECHAS LECTIVAS FINALES:",
        fechasLectivas
    );

    return fechasLectivas;
}

function deduplicarEstudiantesPorDni(lista) {
    const dniVistos = new Set();
    return lista.filter(e => {
        const dni = String(e.dni || "").trim();
        if (!dni || dniVistos.has(dni)) return false;
        dniVistos.add(dni);
        return true;
    });
}

async function generarResumen() {

    const contenedor = document.getElementById("resultadoResumen");
    if (!contenedor) return;

    const grado = document.getElementById("gradoResumen").value;
    const seccion = document.getElementById("seccionResumen").value;
    const anio = Number(document.getElementById("anioResumen").value);
    const periodo = Number(document.getElementById("periodoResumen").value);

    if (!grado || !seccion || !periodo) {
        contenedor.innerHTML =
            `<div class="sin-datos">⚠️ Selecciona <b>grado, sección y período</b>.</div>`;
        return;
    }

    contenedor.innerHTML =
        `<div class="sin-datos">⏳ Generando informe de ${grado} ${seccion}...</div>`;

    try {

        // ----------------------------------------------------------
        // RANGO DEL PERÍODO SELECCIONADO
        // ----------------------------------------------------------
        let mesInicio = 1, mesFin = 12;

        if (periodoSeleccionado === "mensual") {
            mesInicio = periodo;
            mesFin = periodo;
        }
        else if (periodoSeleccionado === "bimestral") {
            mesInicio = (periodo - 1) * 2 + 1;
            mesFin = mesInicio + 1;
        }
        else if (periodoSeleccionado === "trimestral") {
            mesInicio = (periodo - 1) * 3 + 1;
            mesFin = mesInicio + 2;
        }
        else if (periodoSeleccionado === "semestral") {
            mesInicio = periodo === 1 ? 1 : 7;
            mesFin = periodo === 1 ? 6 : 12;
        }

        const fechaInicio =
            `${anio}-${String(mesInicio).padStart(2, "0")}-01`;

        const ultimoDia =
            new Date(anio, mesFin, 0).getDate();

        const fechaFin =
            `${anio}-${String(mesFin).padStart(2, "0")}-${String(ultimoDia).padStart(2, "0")}`;

        const headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
        };

        // ----------------------------------------------------------
        // CONSULTAS INDEPENDIENTES
        // ----------------------------------------------------------
        const [ra, re, rj] = await Promise.all([

            fetch(
                SUPABASE_URL +
                "/rest/v1/vista_asistencia?select=*&fecha=gte." +
                encodeURIComponent(fechaInicio) +
                "&fecha=lte." +
                encodeURIComponent(fechaFin) +
                "&grado=eq." +
                encodeURIComponent(grado) +
                "&seccion=eq." +
                encodeURIComponent(seccion),
                { headers }
            ),

            fetch(
                SUPABASE_URL +
                "/rest/v1/estudiantes?select=*&grado=eq." +
                encodeURIComponent(grado) +
                "&seccion=eq." +
                encodeURIComponent(seccion) +
                "&order=orden.asc",
                { headers }
            ),

            fetch(
                SUPABASE_URL +
                "/rest/v1/justificaciones?select=*&fecha=gte." +
                encodeURIComponent(fechaInicio) +
                "&fecha=lte." +
                encodeURIComponent(fechaFin),
                { headers }
            )
        ]);

        if (!ra.ok)
            throw new Error("No se pudieron consultar los registros de asistencia.");

        if (!re.ok)
            throw new Error("No se pudo consultar la lista de estudiantes.");

        const asistencias = await ra.json();

        const estudiantes =
            deduplicarEstudiantesPorDni(await re.json());

        // Si la tabla de justificaciones todavía no existe,
        // el resumen de asistencia sigue funcionando.
        let justificaciones = [];
        let justificacionesDisponible = true;

        if (rj.ok) {
            justificaciones = await rj.json();
        } else {
            justificacionesDisponible = false;
        }

        // ----------------------------------------------------------
        // FECHAS LECTIVAS
        // ----------------------------------------------------------
        const fechasLectivas =
            generarFechasLectivas(fechaInicio, fechaFin);

        // ----------------------------------------------------------
        // MAPA DE ASISTENCIAS
        // ----------------------------------------------------------
        const asistenciaMap = new Map();

        asistencias.forEach(r => {

            const dni =
                String(r.dni || "").trim();

            const fecha =
                String(r.fecha || "").substring(0, 10);

            if (!dni || !fecha) return;

            asistenciaMap.set(dni + "|" + fecha, r);
        });

        // ----------------------------------------------------------
        // MAPA DE JUSTIFICACIONES
        // ----------------------------------------------------------
        const justMap = new Map();

        justificaciones.forEach(j => {

            const dni =
                String(j.dni || j.DNI || "").trim();

            const fecha =
                String(j.fecha || j.Fecha || "").substring(0, 10);

            if (!dni || !fecha) return;

            justMap.set(dni + "|" + fecha, j);
        });

        const normalizarEstado = r =>
            String(r?.estado || "").trim().toUpperCase();

        // ----------------------------------------------------------
        // CONSTRUIR RESULTADO FINAL
        //
        // TARDANZA JUSTIFICADA       -> TEMPRANO FINAL
        // DEMASIADO TARDE JUSTIFICADO -> TEMPRANO FINAL
        // FALTA JUSTIFICADA          -> NO SE CUENTA COMO FALTA
        //
        // PERO SIEMPRE CONSERVAMOS LA SITUACIÓN ORIGINAL
        // PARA EL INFORME DE JUSTIFICACIONES.
        // ----------------------------------------------------------
        const registros = [];

        estudiantes.forEach(e => {

            const dni =
                String(e.dni || "").trim();

            fechasLectivas.forEach(fecha => {

                const originalRegistro =
                    asistenciaMap.get(dni + "|" + fecha);

                const original =
                    originalRegistro
                        ? normalizarEstado(originalRegistro)
                        : "FALTO";

                const just =
                    justMap.get(dni + "|" + fecha);

                let estadoFinal = original;

                if (just) {

                    // Para el resumen, toda justificación aceptada
                    // deja de contar como incidencia.
                    if (
                        original === "TARDANZA" ||
                        original === "DEMASIADO TARDE"
                    ) {
                        estadoFinal = "TEMPRANO";
                    }
                    else if (original === "FALTO") {
                        // Una falta justificada no es una falta final.
                        // Se conserva aparte como "Falta justificada".
                        estadoFinal = "JUSTIFICADA";
                    }
                }

                registros.push({
                    dni,
                    nombre: e.nombre || "",
                    grado: e.grado || grado,
                    seccion: e.seccion || seccion,
                    fecha,
                    original,
                    estado: estadoFinal,
                    just: Boolean(just),
                    justData: just || null
                });

            });
        });

        // ----------------------------------------------------------
        // RESUMEN FINAL
        // ----------------------------------------------------------
        const resumen = {
            TEMPRANO: 0,
            TARDANZA: 0,
            "DEMASIADO TARDE": 0,
            FALTO: 0
        };

        registros.forEach(r => {

            if (r.estado === "TEMPRANO")
                resumen.TEMPRANO++;

            if (r.estado === "TARDANZA")
                resumen.TARDANZA++;

            if (r.estado === "DEMASIADO TARDE")
                resumen["DEMASIADO TARDE"]++;

            if (r.estado === "FALTO")
                resumen.FALTO++;
        });

        const justRegistros =
            registros.filter(r => r.just);

        const totalFinal =
            Object.values(resumen).reduce((a, b) => a + b, 0);

        const porcentajeFinal = n =>
            totalFinal ? (n / totalFinal * 100) : 0;

        // ----------------------------------------------------------
        // JUSTIFICACIONES POR TIPO
        // ----------------------------------------------------------
        const justPorTipo = {
            TARDANZA: 0,
            "DEMASIADO TARDE": 0,
            FALTO: 0
        };

        justRegistros.forEach(r => {

            if (Object.prototype.hasOwnProperty.call(
                justPorTipo,
                r.original
            )) {
                justPorTipo[r.original]++;
            }
        });

        const totalJust =
            justRegistros.length;

        const porcentajeJust = n =>
            totalJust ? (n / totalJust * 100) : 0;

        // ----------------------------------------------------------
        // NOMBRE DEL PERÍODO
        // ----------------------------------------------------------
        let nombrePeriodo = "";

        if (periodoSeleccionado === "mensual")
            nombrePeriodo = mesesResumen[periodo - 1];

        else if (periodoSeleccionado === "bimestral")
            nombrePeriodo = `${periodo}° Bimestre`;

        else if (periodoSeleccionado === "trimestral")
            nombrePeriodo = `${periodo}° Trimestre`;

        else if (periodoSeleccionado === "semestral")
            nombrePeriodo = `${periodo}° Semestre`;

        else
            nombrePeriodo = "Año completo";

        // ----------------------------------------------------------
        // DATOS DIARIOS DE ASISTENCIA
        // ----------------------------------------------------------
        const diario = fechasLectivas.map(fecha => {

            const rs =
                registros.filter(r => r.fecha === fecha);

            return {
                fecha,

                TEMPRANO:
                    rs.filter(r => r.estado === "TEMPRANO").length,

                TARDANZA:
                    rs.filter(r => r.estado === "TARDANZA").length,

                "DEMASIADO TARDE":
                    rs.filter(r => r.estado === "DEMASIADO TARDE").length,

                FALTO:
                    rs.filter(r => r.estado === "FALTO").length
            };
        });

        // ----------------------------------------------------------
        // DATOS DIARIOS DE JUSTIFICACIONES
        // ----------------------------------------------------------
        const diarioJust = fechasLectivas.map(fecha => {

            const rs =
                justRegistros.filter(r => r.fecha === fecha);

            return {
                fecha,

                TARDANZA:
                    rs.filter(r => r.original === "TARDANZA").length,

                "DEMASIADO TARDE":
                    rs.filter(r => r.original === "DEMASIADO TARDE").length,

                FALTO:
                    rs.filter(r => r.original === "FALTO").length
            };
        });

        // ----------------------------------------------------------
        // FUNCIONES DE SEGURIDAD HTML
        // ----------------------------------------------------------
        function esc(v) {

            return String(v ?? "")
                .replace(/[&<>\"]/g, m => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;"
                }[m]));
        }

        function colorEstado(s) {

            if (s === "TEMPRANO") return "#16a34a";
            if (s === "TARDANZA") return "#eab308";
            if (s === "DEMASIADO TARDE") return "#f97316";
            return "#ef4444";
        }

        function colorJust(s) {

            if (s === "TARDANZA") return "#7c3aed";
            if (s === "DEMASIADO TARDE") return "#9333ea";
            return "#a855f7";
        }

        // ----------------------------------------------------------
        // CREAR GRÁFICO POLIGONAL SVG
        // ----------------------------------------------------------
        function crearGraficoPoligonal(datos, series, colores) {

            const W = 760;
            const H = 300;

            const ML = 48;
            const MR = 18;
            const MT = 18;
            const MB = 42;

            const pw = W - ML - MR;
            const ph = H - MT - MB;

            const maxVal =
                Math.max(
                    1,
                    ...datos.flatMap(d =>
                        series.map(s => Number(d[s] || 0))
                    )
                );

            const yMax =
                Math.max(5, Math.ceil(maxVal / 5) * 5);

            const xAt = i =>
                datos.length <= 1
                    ? ML + pw / 2
                    : ML + (i / (datos.length - 1)) * pw;

            const yAt = v =>
                MT + ph - (v / yMax) * ph;

            let svg =
                `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

            // Cuadrícula
            for (let k = 0; k <= 5; k++) {

                const v =
                    Math.round(yMax * k / 5);

                const y =
                    yAt(v);

                svg += `
                    <line
                        x1="${ML}" y1="${y}"
                        x2="${W - MR}" y2="${y}"
                        stroke="#e2e8f0"
                    />
                    <text
                        x="${ML - 8}" y="${y + 4}"
                        text-anchor="end"
                        font-size="11"
                        fill="#64748b"
                    >${v}</text>
                `;
            }

            // Líneas
            series.forEach((s, indice) => {

                const puntos =
                    datos.map((d, i) =>
                        `${xAt(i)},${yAt(Number(d[s] || 0))}`
                    ).join(" ");

                svg += `
                    <polyline
                        points="${puntos}"
                        fill="none"
                        stroke="${colores[indice]}"
                        stroke-width="3"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />
                `;

                datos.forEach((d, i) => {

                    svg += `
                        <circle
                            cx="${xAt(i)}"
                            cy="${yAt(Number(d[s] || 0))}"
                            r="3.5"
                            fill="${colores[indice]}"
                        >
                            <title>
                                ${esc(s)} — ${esc(d.fecha)}:
                                ${Number(d[s] || 0)}
                            </title>
                        </circle>
                    `;
                });
            });

            const paso =
                Math.max(1, Math.ceil(datos.length / 8));

            datos.forEach((d, i) => {

                if (i % paso === 0 || i === datos.length - 1) {

                    svg += `
                        <text
                            x="${xAt(i)}"
                            y="${H - 14}"
                            text-anchor="middle"
                            font-size="10"
                            fill="#64748b"
                        >${d.fecha.substring(8, 10)}/${d.fecha.substring(5, 7)}</text>
                    `;
                }
            });

            svg += `</svg>`;

            return svg;
        }

        // ----------------------------------------------------------
        // TENDENCIA DE JUSTIFICACIONES
        // Primera mitad vs segunda mitad del período.
        // ----------------------------------------------------------
        function calcularTendenciaJustificaciones() {

            if (!diarioJust.length)
                return {
                    primera: 0,
                    segunda: 0,
                    porcentaje: 0,
                    texto: "Sin datos"
                };

            const mitad =
                Math.ceil(diarioJust.length / 2);

            const primera =
                diarioJust
                    .slice(0, mitad)
                    .reduce(
                        (s, d) =>
                            s +
                            d.TARDANZA +
                            d["DEMASIADO TARDE"] +
                            d.FALTO,
                        0
                    );

            const segunda =
                diarioJust
                    .slice(mitad)
                    .reduce(
                        (s, d) =>
                            s +
                            d.TARDANZA +
                            d["DEMASIADO TARDE"] +
                            d.FALTO,
                        0
                    );

            if (primera === 0 && segunda === 0) {

                return {
                    primera,
                    segunda,
                    porcentaje: 0,
                    texto: "Sin justificaciones"
                };
            }

            if (primera === 0) {

                return {
                    primera,
                    segunda,
                    porcentaje: 100,
                    texto: "📈 Incremento"
                };
            }

            const porcentaje =
                ((segunda - primera) / primera) * 100;

            return {
                primera,
                segunda,
                porcentaje,
                texto:
                    porcentaje > 0
                        ? "📈 Incremento"
                        : porcentaje < 0
                            ? "📉 Disminución"
                            : "➡️ Sin variación"
            };
        }

        const tendencia =
            calcularTendenciaJustificaciones();

        // ----------------------------------------------------------
        // LISTADO DE JUSTIFICACIONES
        // ----------------------------------------------------------
        const justRows =
            justRegistros
                .slice()
                .sort(
                    (a, b) =>
                        a.fecha.localeCompare(b.fecha) ||
                        a.nombre.localeCompare(b.nombre)
                );

        const justHtml =
            justRows.length
                ? justRows.map(r => {

                    const j =
                        r.justData || {};

                    const motivo =
                        j.motivo ||
                        j.Motivo ||
                        "";

                    const tipo =
                        r.original === "FALTO"
                            ? "Falta justificada"
                            : r.original === "TARDANZA"
                                ? "Tardanza justificada"
                                : "Demasiado tarde justificado";

                    return `
                        <div class="just-row">
                            <strong>
                                ${esc(r.fecha)} — ${esc(r.nombre)}
                            </strong>

                            <span>
                                DNI: ${esc(r.dni)}
                            </span>

                            <span>
                                ${esc(r.grado)} ${esc(r.seccion)}
                            </span>

                            <span class="just-badge">
                                ${esc(tipo)}
                            </span>

                            ${
                                motivo
                                    ? `<span>Motivo: ${esc(motivo)}</span>`
                                    : ""
                            }
                        </div>
                    `;

                }).join("")

                : `
                    <div class="sin-datos">
                        No hay justificaciones registradas en este período.
                    </div>
                `;

        // ----------------------------------------------------------
        // GRÁFICOS
        // ----------------------------------------------------------
        const svgAsistencia =
            crearGraficoPoligonal(
                diario,
                [
                    "TEMPRANO",
                    "TARDANZA",
                    "DEMASIADO TARDE",
                    "FALTO"
                ],
                [
                    "#16a34a",
                    "#eab308",
                    "#f97316",
                    "#ef4444"
                ]
            );

        const svgJustificaciones =
            crearGraficoPoligonal(
                diarioJust,
                [
                    "TARDANZA",
                    "DEMASIADO TARDE",
                    "FALTO"
                ],
                [
                    "#7c3aed",
                    "#9333ea",
                    "#a855f7"
                ]
            );

        // ----------------------------------------------------------
        // INFORME
        // ----------------------------------------------------------
        contenedor.innerHTML = `

            <div class="resumen-profesional-nuevo">

                <div class="resumen-titulo-nuevo">

                    <div>
                        <h3>
                            📊 ${esc(grado)} ${esc(seccion)}
                            — INFORME DE ASISTENCIA
                        </h3>

                        <p>
                            <b>${esc(nombrePeriodo)}</b>
                            · ${anio}
                            · ${fechaInicio} al ${fechaFin}
                        </p>
                    </div>

                    <div class="resumen-total-box">
                        REGISTROS
                        <strong>${totalFinal}</strong>
                    </div>

                </div>


                <!-- ==================================================
                     ASISTENCIA FINAL
                     ================================================== -->

                <div class="resumen-cuerpo">

                    <div class="resumen-card-nuevo">

                        <h4>📌 RESULTADO FINAL</h4>

                        <div class="estado-linea estado-verde">
                            <span>🟢 Temprano</span>
                            <span class="estado-num">
                                ${resumen.TEMPRANO}
                            </span>
                            <span class="estado-pct">
                                ${porcentajeFinal(resumen.TEMPRANO).toFixed(1)}%
                            </span>
                        </div>

                        <div class="estado-linea estado-amarillo">
                            <span>🟡 Tardanza</span>
                            <span class="estado-num">
                                ${resumen.TARDANZA}
                            </span>
                            <span class="estado-pct">
                                ${porcentajeFinal(resumen.TARDANZA).toFixed(1)}%
                            </span>
                        </div>

                        <div class="estado-linea estado-naranja">
                            <span>🟠 Demasiado tarde</span>
                            <span class="estado-num">
                                ${resumen["DEMASIADO TARDE"]}
                            </span>
                            <span class="estado-pct">
                                ${porcentajeFinal(resumen["DEMASIADO TARDE"]).toFixed(1)}%
                            </span>

                            <span>🔴 Falta</span>
                            <span class="estado-num">

                                ${porcentajeFinal(resumen.FALTO).toFixed(1)}%
                            </span>

                            📌 <b>JUSTIFICACIONES ACEPTADAS</b>

                            <br>

                                (${totalFinal

                                    : "0.0"}% de las incidencias originales)

                        <p style="

                        ">
                            Las justificaciones no se contabilizan como

                    <!-- ==================================================

                    <div class="resumen-card-nuevo">

                        <div class="chart-legend">

                            <span class="legend-item">

                                    style="background:#7c3aed"

function mostrar(datos) {

    const resultado =
        document.getElementById("resultado");

    if (!datos.length) {

        resultado.innerHTML =
            "<p>❌ No se encontraron registros.</p>";

        return;
    }

    let html = `
    <div class="tabla">

    <table>

    <thead>

    <tr>
        <th>Grado</th>
        <th>Sección</th>
        <th>Orden</th>
        <th>Apellidos y nombres</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>
    `;

    datos.forEach(e => {

        let clase = "";

        if (e.estado === "TEMPRANO")
            clase = "temprano";

        if (e.estado === "TARDANZA")
            clase = "tardanza";

        if (e.estado === "DEMASIADO TARDE")
            clase = "demasiado";

        if (e.estado === "FALTO")
            clase = "falto";

        if (e.justificada)
            clase = "justificado";

        html += `
        <tr>

            <td>${e.grado ?? ""}</td>

            <td>${e.seccion ?? ""}</td>

            <td>${e.orden ?? ""}</td>

            <td>${e.nombre ?? ""}</td>

            <td>${e.dni ?? ""}</td>

            <td>${e.fecha ?? ""}</td>

            <td>${e.dia ?? ""}</td>

            <td>${e.hora ?? ""}</td>

            <td class="${clase}">
                <strong>${e.estado ?? ""}</strong>
                ${e.justificada && e.motivoJustificacion
                    ? `<br><small style="font-weight:400">Motivo: ${e.motivoJustificacion}</small>`
                    : ""}
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>

    </div>

    <p>
        <b>Total:</b> ${datos.length} registros
    </p>
    `;

    resultado.innerHTML = html;
}

function descargar() {

    let csv =
        "Grado,Sección,Orden,Apellidos y nombres,DNI,Fecha,Día,Hora,Estado\n";

    datosActuales.forEach(e => {

        csv += [
            e.grado,
            e.seccion,
            e.orden,
            `"${e.nombre}"`,
            e.dni,
            e.fecha,
            e.dia,
            e.hora,
            e.estado
        ].join(",") + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "reporte_asistencia.csv";

    enlace.click();
}

window.abrirRegistrarJustificacion = function() {

    const fondo = document.createElement("div");
    fondo.className = "modal-justificacion";

    const ventana = document.createElement("div");
    ventana.className = "ventana-justificacion";

    ventana.innerHTML = `
        <h3>📝 Registrar justificación</h3>
        <p class="ayuda">
            Registra una justificación para un estudiante en una fecha concreta.
            La situación original se conserva para el informe.
        </p>

        <div class="form-just">
            <label for="justDni">DNI del estudiante</label>
            <input id="justDni" type="text" inputmode="numeric"
                   maxlength="12" placeholder="Ingrese el DNI">
        </div>

        <div class="form-just">
            <label for="justFecha">Fecha</label>
            <input id="justFecha" type="date">
        </div>

        <div class="form-just">
            <label for="justTipo">Tipo de justificación</label>
            <select id="justTipo">
                <option value="">Seleccione...</option>
                <option value="TARDANZA">Justificación de tardanza</option>
                <option value="DEMASIADO TARDE">Justificación de demasiado tarde</option>
                <option value="FALTO">Justificación de falta</option>
            </select>
        </div>

        <div class="form-just">
            <label for="justMotivo">Motivo / sustento</label>
            <textarea id="justMotivo"
                placeholder="Ejemplo: cita médica, enfermedad, emergencia familiar..."></textarea>
        </div>

        <div class="justificacion-aviso">
            ℹ️ Al guardar, el resumen contabilizará ese registro como
            <b>TEMPRANO</b>, pero mostrará que fue una
            <b>tardanza, demasiado tarde o falta justificada</b>.
        </div>

        <div class="botones-just">
            <button class="btn-guardar-just" id="btnGuardarJust">💾 Guardar</button>
            <button class="btn-cancelar-just" id="btnCancelarJust">❌ Cancelar</button>
        </div>
    `;

    fondo.appendChild(ventana);
    document.body.appendChild(fondo);

    const dniInput = document.getElementById("justDni");
    const fechaInput = document.getElementById("justFecha");
    const tipoInput = document.getElementById("justTipo");
    const motivoInput = document.getElementById("justMotivo");

    // Si el usuario ya seleccionó grado/sección/periodo en el resumen,
    // se toma una fecha razonable del período actual.
    const hoy = new Date();
    fechaInput.value =
        `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;

    document.getElementById("btnCancelarJust").onclick = () => fondo.remove();

    document.getElementById("btnGuardarJust").onclick = async function() {

        const dni = dniInput.value.trim();
        const fecha = fechaInput.value;
        const tipoSeleccionado = tipoInput.value;
        const motivo = motivoInput.value.trim();

        if (!/^\d{8}$/.test(dni)) {
            alert("⚠️ Ingresa un DNI válido de 8 dígitos.");
            return;
        }

        if (!fecha) {
            alert("⚠️ Selecciona la fecha.");
            return;
        }

        if (!tipoSeleccionado) {
            alert("⚠️ Selecciona el tipo de justificación.");
            return;
        }

        if (!motivo) {
            alert("⚠️ Escribe el motivo o sustento.");
            return;
        }

        const boton = this;
        boton.disabled = true;
        boton.textContent = "⏳ Verificando...";

        try {
            const headers = {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            };

            // 1. Verificar estudiante y obtener su situación original.
            const urlEstudiante =
                SUPABASE_URL +
                "/rest/v1/estudiantes?select=*&dni=eq." +
                encodeURIComponent(dni);

            const respuestaEstudiante =
                await fetch(urlEstudiante, { headers });

            if (!respuestaEstudiante.ok) {
                throw new Error("No se pudo consultar el estudiante.");
            }

            const estudiantes = await respuestaEstudiante.json();

            if (!estudiantes.length) {
                alert("❌ No existe un estudiante registrado con ese DNI.");
                boton.disabled = false;
                boton.textContent = "💾 Guardar";
                return;
            }

            // 2. Buscar el registro de asistencia de ese día.
            const urlAsistencia =
                SUPABASE_URL +
                "/rest/v1/vista_asistencia?select=estado&dni=eq." +
                encodeURIComponent(dni) +
                "&fecha=eq." +
                encodeURIComponent(fecha);

            const respuestaAsistencia =
                await fetch(urlAsistencia, { headers });

            if (!respuestaAsistencia.ok) {
                throw new Error("No se pudo consultar la asistencia de ese día.");
            }

            const registrosAsistencia = await respuestaAsistencia.json();

            // Si no existe registro, por la lógica del sistema se considera FALTO.
            const situacionOriginal =
                registrosAsistencia.length
                    ? String(registrosAsistencia[0].estado || "").trim().toUpperCase()
                    : "FALTO";

            if (!["TARDANZA", "DEMASIADO TARDE", "FALTO"].includes(situacionOriginal)) {
                alert(
                    "⚠️ El estudiante no tiene una tardanza, demasiado tarde o falta " +
                    "para la fecha seleccionada.\n\n" +
                    "Situación encontrada: " + (situacionOriginal || "SIN REGISTRO")
                );
                boton.disabled = false;
                boton.textContent = "💾 Guardar";
                return;
            }

            if (situacionOriginal !== tipoSeleccionado) {
                const nombres = {
                    "TARDANZA": "TARDANZA",
                    "DEMASIADO TARDE": "DEMASIADO TARDE",
                    "FALTO": "FALTA"
                };

                alert(
                    "⚠️ El tipo seleccionado no coincide con la situación registrada.\n\n" +
                    "Situación real del día: " + nombres[situacionOriginal] + "\n" +
                    "Seleccionaste: " + nombres[tipoSeleccionado] + "\n\n" +
                    "Selecciona la opción correcta."
                );

                boton.disabled = false;
                boton.textContent = "💾 Guardar";
                return;
            }

            boton.textContent = "⏳ Guardando...";

            // 3. Guardar la justificación sin alterar la asistencia original.
            const respuestaGuardar = await fetch(
                SUPABASE_URL + "/rest/v1/justificaciones",
                {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        dni: dni,
                        fecha: fecha,
                        situacion: situacionOriginal,
                        motivo: motivo
                    })
                }
            );

            if (!respuestaGuardar.ok) {
                const errorTexto = await respuestaGuardar.text();

                // Error típico de Supabase cuando la tabla todavía no fue creada
                // o todavía no aparece en el schema cache.
                if (errorTexto.includes("PGRST205") ||
                    errorTexto.includes("Could not find the table 'public.justificaciones'")) {
                    throw new Error(
                        "La tabla JUSTIFICACIONES todavía no está creada en Supabase.\n\n" +
                        "Primero ejecuta en el Editor SQL el script " +
                        "crear_tabla_justificaciones.sql que acompaña este archivo.\n\n" +
                        "Después recarga la página e inténtalo nuevamente."
                    );
                }

                if (errorTexto.includes("23505") ||
                    errorTexto.includes("duplicate") ||
                    errorTexto.includes("unique")) {
                    throw new Error(
                        "Ya existe una justificación registrada para ese estudiante y esa fecha."
                    );
                }

                throw new Error(errorTexto || "No se pudo guardar la justificación.");
            }

            alert(
                "✅ Justificación registrada correctamente.\n\n" +
                "DNI: " + dni +
                "\nFecha: " + fecha +
                "\nSituación original: " + situacionOriginal +
                "\n\nEn el RESUMEN dejará de contar como incidencia y quedará registrada como justificada."
            );

            fondo.remove();

            // Si el resumen estaba visible, se actualiza automáticamente.
            const resultadoResumen = document.getElementById("resultadoResumen");
            if (resultadoResumen && resultadoResumen.innerHTML.trim()) {
                setTimeout(() => generarResumen(), 250);
            }

        } catch (error) {

            console.error(error);

            alert(
                "❌ No se pudo registrar la justificación.\n\n" +
                error.message
            );

            boton.disabled = false;
            boton.textContent = "💾 Guardar";
        }
    };
};

window.abrirDiasNoLectivos = function() {

    const fondo = document.createElement("div");

    fondo.style.position = "fixed";
    fondo.style.top = "0";
    fondo.style.left = "0";
    fondo.style.width = "100%";
    fondo.style.height = "100%";
    fondo.style.background = "rgba(0,0,0,0.5)";
    fondo.style.display = "flex";
    fondo.style.alignItems = "center";
    fondo.style.justifyContent = "center";
    fondo.style.zIndex = "9999";

    const ventana = document.createElement("div");

    ventana.style.background = "white";
    ventana.style.padding = "25px";
    ventana.style.borderRadius = "12px";
    ventana.style.width = "360px";
    ventana.style.maxWidth = "90%";
    ventana.style.boxShadow = "0 5px 20px rgba(0,0,0,0.3)";

    ventana.innerHTML = `
        <h2 style="margin-top:0; color:#1d4ed8;">
            📅 Días no lectivos
        </h2>

        <label><b>Año:</b></label>
        <select id="nuevoAnio" style="width:100%;padding:10px;margin:8px 0;">
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
        </select>

        <label><b>Mes:</b></label>
        <select id="nuevoMes" style="width:100%;padding:10px;margin:8px 0;">
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>

        <label><b>Fecha:</b></label>
        <select id="nuevoDia" style="width:100%;padding:10px;margin:8px 0;">
        </select>

        <label><b>Motivo:</b></label>
        <input
            type="text"
            id="nuevoMotivo"
            placeholder="Ejemplo: Suspensión de clases"
            style="width:100%;padding:10px;margin:8px 0;box-sizing:border-box;"
        >

        <div style="display:flex;gap:10px;margin-top:15px;">

            <button id="btnGuardarDia"
                style="flex:1;padding:10px;background:#1d4ed8;color:white;border:none;border-radius:7px;cursor:pointer;">
                💾 Guardar
            </button>

            <button id="btnCancelarDia"
                style="flex:1;padding:10px;background:#64748b;color:white;border:none;border-radius:7px;cursor:pointer;">
                ❌ Cancelar
            </button>

        </div>
    `;

    fondo.appendChild(ventana);
    document.body.appendChild(fondo);

    const anio = document.getElementById("nuevoAnio");
    const mes = document.getElementById("nuevoMes");
    const dia = document.getElementById("nuevoDia");

    function cargarDias() {

        const año = Number(anio.value);
        const mesSeleccionado = Number(mes.value);

        const cantidadDias =
            new Date(año, mesSeleccionado, 0).getDate();

        dia.innerHTML = "";

        for (let d = 1; d <= cantidadDias; d++) {

            const opcion = document.createElement("option");

            opcion.value =
                String(d).padStart(2, "0");

            opcion.textContent =
                String(d).padStart(2, "0");

            dia.appendChild(opcion);
        }
    }

    anio.addEventListener("change", cargarDias);
    mes.addEventListener("change", cargarDias);

    cargarDias();

    document.getElementById("btnCancelarDia").onclick =
        function() {

            fondo.remove();

        };

    document.getElementById("btnGuardarDia").onclick =
        async function() {

            const fecha =
                anio.value + "-" +
                String(mes.value).padStart(2, "0") + "-" +
                dia.value;

            const motivo =
                document.getElementById("nuevoMotivo").value.trim();

            if (!motivo) {

                alert("⚠️ Escribe el motivo.");

                return;
            }

            try {

                const respuesta = await fetch(
                    SUPABASE_URL +
                    "/rest/v1/dias_no_lectivos",
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                "Bearer " + SUPABASE_KEY,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=representation"
                        },

                        body: JSON.stringify({
                            fecha: fecha,
                            motivo: motivo
                        })
                    }
                );

                if (!respuesta.ok) {

                    const error =
                        await respuesta.text();

                    alert(
                        "❌ No se pudo guardar.\n\n" +
                        error
                    );

                    return;
                }

                alert(
                    "✅ Día no lectivo registrado.\n\n" +
                    "Fecha: " + fecha +
                    "\nMotivo: " + motivo
                );

                fondo.remove();

            } catch (error) {

                console.error(error);

                alert(
                    "❌ Error al guardar:\n" +
                    error.message
                );
            }
        };
};
</script>
