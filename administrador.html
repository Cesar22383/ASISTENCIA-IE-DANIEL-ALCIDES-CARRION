<script>

const SUPABASE_URL =

let datosActuales = [];
// ==========================================

let periodoSeleccionado = "mensual";

const mesesResumen = [

window.seleccionarPeriodo = function(tipo) {

    periodoSeleccionado = tipo;

    document.querySelectorAll(".btn-periodo").forEach(boton => {
        boton.classList.remove("activo");
    });

    const botonActivo = document.querySelector(
        `.btn-periodo[onclick="seleccionarPeriodo('${tipo}')"]`
    );

    if (botonActivo) {
        botonActivo.classList.add("activo");
    }

    const periodo = document.getElementById("periodoResumen");

    if (!periodo) return;

    periodo.innerHTML = "";

    let opciones = [];

    if (tipo === "mensual") {

        opciones = mesesResumen.map((mes, indice) => ({
            valor: indice + 1,
            texto: mes
        }));

    } else if (tipo === "bimestral") {

        opciones = [
            { valor: 1, texto: "1.er Bimestre (Enero - Febrero)" },
            { valor: 2, texto: "2.º Bimestre (Marzo - Abril)" },
            { valor: 3, texto: "3.er Bimestre (Mayo - Junio)" },
            { valor: 4, texto: "4.º Bimestre (Julio - Agosto)" },
            { valor: 5, texto: "5.º Bimestre (Septiembre - Octubre)" },
            { valor: 6, texto: "6.º Bimestre (Noviembre - Diciembre)" }
        ];

    } else if (tipo === "trimestral") {

        opciones = [
            { valor: 1, texto: "1.er Trimestre (Enero - Marzo)" },
            { valor: 2, texto: "2.º Trimestre (Abril - Junio)" },
            { valor: 3, texto: "3.er Trimestre (Julio - Septiembre)" },
            { valor: 4, texto: "4.º Trimestre (Octubre - Diciembre)" }
        ];

    } else if (tipo === "semestral") {

        opciones = [
            { valor: 1, texto: "1.er Semestre (Enero - Junio)" },
            { valor: 2, texto: "2.º Semestre (Julio - Diciembre)" }
        ];

    } else if (tipo === "anual") {

        opciones = [
            { valor: 1, texto: "Año completo (Enero - Diciembre)" }
        ];
    }

    opciones.forEach(opcion => {

        const option = document.createElement("option");

        option.value = opcion.valor;
        option.textContent = opcion.texto;

        periodo.appendChild(option);
    });
}
// ==========================================================
// CALENDARIO ESCOLAR
// PIURA - AÑO 2026
// ==========================================================

function esDiaLectivo(fecha) {

    if (!fecha) return false;

    const fechaObj =
        new Date(fecha + "T12:00:00");

    if (isNaN(fechaObj.getTime())) {
        return false;
    }

    const anio =
        fechaObj.getFullYear();

    // ======================================================
    // CALENDARIO EXCEPCIONAL PIURA 2026
    // ======================================================

    if (anio === 2026) {

        // Inicio del control de asistencia
        if (fecha < "2026-08-24") {
            return false;
        }

        // Fin de clases
        if (fecha > "2026-11-27") {
            return false;
        }

        // Sábado y domingo no cuentan
        const diaSemana =
            fechaObj.getDay();

        if (diaSemana === 0 || diaSemana === 6) {
            return false;
        }

        // III BIMESTRE
        if (
            fecha >= "2026-08-24" &&
            fecha <= "2026-10-02"
        ) {
            return true;
        }

        // IV BIMESTRE
        if (
            fecha >= "2026-10-05" &&
            fecha <= "2026-11-27"
        ) {
            return true;
        }

        return false;
    }

    // ======================================================
    // OTROS AÑOS - CALENDARIO NORMAL
    // ======================================================

    const diaSemana =
        fechaObj.getDay();

    if (diaSemana === 0 || diaSemana === 6) {
        return false;
    }

    return true;
}

// ==========================================================
// FUNCIONES AUXILIARES COMPARTIDAS
// (usadas tanto por generarResumen() como por consultar()
//  para que ambas pantallas calculen exactamente igual)
// ==========================================================

function obtenerFechaHoyPeru() {
    const ahoraPeru = new Date();
    return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Lima",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).format(ahoraPeru);
}

function puedeContarseFaltaHoyFn() {
    const ahoraPeru = new Date();
    const horaPeru = Number(
        new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Lima",
            hour: "2-digit",
            hour12: false
        }).format(ahoraPeru)
    );
    return horaPeru >= 11;
}

function generarFechasLectivas(fechaInicio, fechaFin) {

    const FECHA_INICIO_ASISTENCIA = "2026-08-24";

    const fechaHoyPeru = obtenerFechaHoyPeru();
    console.log("HOY EN PERÚ:", fechaHoyPeru);
    const puedeContarseFaltaHoy = puedeContarseFaltaHoyFn();

    const fechasLectivas = [];

    let cursor = new Date(fechaInicio + "T12:00:00");
    const finRango = new Date(fechaFin + "T12:00:00");

    while (cursor <= finRango) {

        const f = cursor.toISOString().split("T")[0];
        const diaSemana = cursor.getDay();

        const esFuturo = f > fechaHoyPeru;
        const esHoySinHabilitar = (f === fechaHoyPeru && !puedeContarseFaltaHoy);
        const antesDeInicio = f < FECHA_INICIO_ASISTENCIA;
console.log(
    "FECHA:", f,
    "| HOY:", fechaHoyPeru,
    "| FUTURO:", esFuturo,
    "| DÍA:", diaSemana
);
        if (
            diaSemana !== 0 && diaSemana !== 6 &&
            esDiaLectivo(f) &&
            !esFuturo && !esHoySinHabilitar && !antesDeInicio
        ) {
            fechasLectivas.push(f);
        }

        cursor.setDate(cursor.getDate() + 1);
    }

    return fechasLectivas;
}

function deduplicarEstudiantesPorDni(lista) {
    const dniVistos = new Set();
    return lista.filter(e => {
        const dni = String(e.dni || "").trim();
        if (!dni || dniVistos.has(dni)) return false;
        dniVistos.add(dni);
        return true;
    });
}

async function generarResumen() {

    const contenedor =
        document.getElementById("resultadoResumen");

    if (!contenedor) return;

    const anio =
        Number(document.getElementById("anioResumen").value);

    const periodo =
        Number(document.getElementById("periodoResumen").value);

    if (!anio || !periodo || !periodoSeleccionado) {

        contenedor.innerHTML =
            "<p style='color:red'>⚠️ Selecciona año y período.</p>";

        return;
    }

    contenedor.innerHTML = `
        <div style="
            padding:20px;
            text-align:center;
            font-weight:bold;
            color:#1d4ed8;
        ">
            ⏳ Generando resumen de asistencia...
        </div>
    `;

    try {

        // ==========================================
        // CALCULAR MESES DEL PERÍODO
        // ==========================================

        let mesInicio = 1;
        let mesFin = 12;

        if (periodoSeleccionado === "mensual") {

            mesInicio = periodo;
            mesFin = periodo;

        } else if (periodoSeleccionado === "bimestral") {

            mesInicio =
                (periodo - 1) * 2 + 1;

            mesFin =
                mesInicio + 1;

        } else if (periodoSeleccionado === "trimestral") {

            mesInicio =
                (periodo - 1) * 3 + 1;

            mesFin =
                mesInicio + 2;

        } else if (periodoSeleccionado === "semestral") {

            mesInicio =
                periodo === 1 ? 1 : 7;

            mesFin =
                periodo === 1 ? 6 : 12;

        } else if (periodoSeleccionado === "anual") {

            mesInicio = 1;
            mesFin = 12;

        }

        // ==========================================
        // FECHAS
        // ==========================================

        const fechaInicio =
            `${anio}-${String(mesInicio).padStart(2, "0")}-01`;

        const ultimoDia =
            new Date(anio, mesFin, 0).getDate();

        const fechaFin =
            `${anio}-${String(mesFin).padStart(2, "0")}-${ultimoDia}`;

        // ==========================================
        // CONSULTAR ASISTENCIAS
        // ==========================================

        const urlAsistencia =
            SUPABASE_URL +
            "/rest/v1/vista_asistencia?select=*" +
            "&fecha=gte." +
            encodeURIComponent(fechaInicio) +
            "&fecha=lte." +
            encodeURIComponent(fechaFin);

        const respuestaAsistencia =
            await fetch(urlAsistencia, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }

            });

        if (!respuestaAsistencia.ok) {

            throw new Error(
                "No se pudieron consultar los registros de asistencia."
            );
        }

        const asistencias =
            await respuestaAsistencia.json();

        // ==========================================
        // CONSULTAR ESTUDIANTES (DEDUPLICADOS POR DNI)
        // ==========================================

        const urlEstudiantes =
            SUPABASE_URL +
            "/rest/v1/estudiantes?select=*&order=orden.asc";

        const respuestaEstudiantes =
            await fetch(urlEstudiantes, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }

            });

        if (!respuestaEstudiantes.ok) {

            throw new Error(
                "No se pudo consultar la lista de estudiantes."
            );
        }

        const estudiantesRaw =
            await respuestaEstudiantes.json();

        let estudiantes =
            deduplicarEstudiantesPorDni(estudiantesRaw);

        // ==========================================
        // FILTROS DE GRADO Y SECCIÓN (si existen en el panel)
        // ==========================================

        const selectorGrado =
            document.getElementById("gradoResumen");

        const selectorSeccion =
            document.getElementById("seccionResumen");

        const gradoSeleccionado =
            selectorGrado
                ? selectorGrado.value
                : "";

        const seccionSeleccionada =
            selectorSeccion
                ? selectorSeccion.value
                : "";

        if (
            gradoSeleccionado &&
            gradoSeleccionado !== "todos" &&
            gradoSeleccionado !== "Todos los grados"
        ) {

            estudiantes =
                estudiantes.filter(estudiante =>
                    String(estudiante.grado || "").trim() ===
                    String(gradoSeleccionado).trim()
                );
        }

        if (
            seccionSeleccionada &&
            seccionSeleccionada !== "todas" &&
            seccionSeleccionada !== "Todas las secciones"
        ) {

            estudiantes =
                estudiantes.filter(estudiante =>
                    String(estudiante.seccion || "").trim() ===
                    String(seccionSeleccionada).trim()
                );
        }

        // ==========================================
        // FECHAS LECTIVAS DEL PERÍODO
        // ==========================================

        const fechasLectivas =
            generarFechasLectivas(fechaInicio, fechaFin);

        // ==========================================
        // ESTADOS
        // ==========================================

        const estados = [
            "TEMPRANO",
            "TARDANZA",
            "DEMASIADO TARDE",
            "FALTO"
        ];

        // ==========================================
        // MAPA ÚNICO dni|fecha -> estado
        // ==========================================

        const asistenciaPorClave = new Map();

        asistencias.forEach(registro => {

            const dni =
                String(registro.dni || "").trim();

            const fecha =
                String(registro.fecha || "")
                    .substring(0, 10);

            const estado =
                String(registro.estado || "")
                    .trim()
                    .toUpperCase();

            if (!dni || !fecha) return;
            if (!estados.includes(estado)) return;

            const clave =
                dni + "|" + fecha;

            if (!asistenciaPorClave.has(clave)) {
                asistenciaPorClave.set(clave, estado);
            }
        });

        // ==========================================
        // FUENTE ÚNICA DE VERDAD
        // 1 registro por (estudiante único x fecha lectiva)
        // ==========================================

        const registrosCalculados = [];

        estudiantes.forEach(estudiante => {

            const dni =
                String(estudiante.dni || "").trim();

            if (!dni) return;

            const grado =
                String(estudiante.grado || "").trim();

            const seccion =
                String(estudiante.seccion || "").trim();

            fechasLectivas.forEach(fecha => {

                const clave = dni + "|" + fecha;

                const estado =
                    asistenciaPorClave.get(clave) || "FALTO";

                registrosCalculados.push({
                    dni,
                    nombre: estudiante.nombre || "",
                    grado,
                    seccion,
                    fecha,
                    estado
                });
            });
        });

        // ==========================================
        // RESUMEN, SECCIONES Y PERSONAS
        // (todos salen del mismo arreglo)
        // ==========================================

        const resumen = {
            TEMPRANO: 0,
            TARDANZA: 0,
            "DEMASIADO TARDE": 0,
            FALTO: 0
        };

        const personas = {
            TEMPRANO: [],
            TARDANZA: [],
            "DEMASIADO TARDE": [],
            FALTO: []
        };

        const secciones = {};

        registrosCalculados.forEach(r => {

            resumen[r.estado]++;

            personas[r.estado].push({
                nombre: r.nombre,
                dni: r.dni,
                grado: r.grado,
                seccion: r.seccion,
                fecha: r.fecha
            });

            const claveSeccion =
                `${r.grado}|${r.seccion}`;

            if (!secciones[claveSeccion]) {

                secciones[claveSeccion] = {
                    grado: r.grado,
                    seccion: r.seccion,
                    TEMPRANO: 0,
                    TARDANZA: 0,
                    "DEMASIADO TARDE": 0,
                    FALTO: 0,
                    total: 0
                };
            }

            secciones[claveSeccion][r.estado]++;
            secciones[claveSeccion].total++;
        });

        // ==========================================
        // NOMBRE DEL PERÍODO
        // ==========================================

        let nombrePeriodo = "";

        if (
            periodoSeleccionado === "mensual"
        ) {

            nombrePeriodo =
                mesesResumen[periodo - 1];

        } else if (
            periodoSeleccionado === "bimestral"
        ) {

            nombrePeriodo =
                `${periodo}° Bimestre`;

        } else if (
            periodoSeleccionado === "trimestral"
        ) {

            nombrePeriodo =
                `${periodo}° Trimestre`;

        } else if (
            periodoSeleccionado === "semestral"
        ) {

            nombrePeriodo =
                `${periodo}° Semestre`;

        } else {

            nombrePeriodo =
                "Año completo";
        }

        // ==========================================
        // TOTALES
        // ==========================================

        const totalGeneral =
            resumen.TEMPRANO +
            resumen.TARDANZA +
            resumen["DEMASIADO TARDE"] +
            resumen.FALTO;

        const totalAsistencias =
            resumen.TEMPRANO +
            resumen.TARDANZA +
            resumen["DEMASIADO TARDE"];

        const porcentajeAsistencia =
            totalGeneral > 0
                ? (
                    totalAsistencias /
                    totalGeneral
                ) * 100
                : 0;

        const porcentajeTemprano =
            totalGeneral > 0
                ? (
                    resumen.TEMPRANO /
                    totalGeneral
                ) * 100
                : 0;

        const porcentajeTardanza =
            totalGeneral > 0
                ? (
                    resumen.TARDANZA /
                    totalGeneral
                ) * 100
                : 0;

        const porcentajeDemasiado =
            totalGeneral > 0
                ? (
                    resumen["DEMASIADO TARDE"] /
                    totalGeneral
                ) * 100
                : 0;

        const porcentajeFalto =
            totalGeneral > 0
                ? (
                    resumen.FALTO /
                    totalGeneral
                ) * 100
                : 0;

        // ==========================================
        // HTML DEL RESUMEN
        // ==========================================

        let html = `

        <div class="resumen-profesional">

            <div class="cabecera-resumen">

                <div>

                    <h3>
                        📊 RESUMEN DE ASISTENCIA
                    </h3>

                    <p>
                        <b>${nombrePeriodo}</b>
                        — Año ${anio}
                    </p>

                </div>

                <div class="total-general">

                    TOTAL

                    <strong>
                        ${totalGeneral}
                    </strong>

                </div>

            </div>

            <div class="tarjetas-estados">

                <div class="tarjeta-estado temprano">

                    <span>🟢</span>

                    <small>
                        TEMPRANO
                    </small>

                    <strong>
                        ${resumen.TEMPRANO}
                    </strong>

                    <small>
                        ${porcentajeTemprano.toFixed(2)}%
                    </small>

                </div>

                <div class="tarjeta-estado tardanza">

                    <span>🟡</span>

                    <small>
                        TARDANZA
                    </small>

                    <strong>
                        ${resumen.TARDANZA}
                    </strong>

                    <small>
                        ${porcentajeTardanza.toFixed(2)}%
                    </small>

                </div>

                <div class="tarjeta-estado demasiado">

                    <span>🔴</span>

                    <small>
                        DEMASIADO TARDE
                    </small>

                    <strong>
                        ${resumen["DEMASIADO TARDE"]}
                    </strong>

                    <small>
                        ${porcentajeDemasiado.toFixed(2)}%
                    </small>

                </div>

                <div class="tarjeta-estado falto">

                    <span>⚪</span>

                    <small>
                        FALTÓ
                    </small>

                    <strong>
                        ${resumen.FALTO}
                    </strong>

                    <small>
                        ${porcentajeFalto.toFixed(2)}%
                    </small>

                </div>

            </div>

            <div style="
                margin:20px 0;
                padding:20px;
                border-radius:12px;
                background:#f8fafc;
                text-align:center;
            ">

                <h3>
                    PORCENTAJE DE ASISTENCIA GENERAL
                </h3>

                <div style="
                    font-size:36px;
                    font-weight:bold;
                    color:#16a34a;
                    margin:10px 0;
                ">
                    ${porcentajeAsistencia.toFixed(2)}%
                </div>

                <p>
                    Temprano + Tardanza + Demasiado tarde
                </p>

                <div style="
                    display:flex;
                    justify-content:center;
                    gap:25px;
                    flex-wrap:wrap;
                    margin-top:15px;
                ">

                    <span>
                        🟢 Temprano:
                        <b>${porcentajeTemprano.toFixed(2)}%</b>
                    </span>

                    <span>
                        🟡 Tardanza:
                        <b>${porcentajeTardanza.toFixed(2)}%</b>
                    </span>

                    <span>
                        🔴 Demasiado tarde:
                        <b>${porcentajeDemasiado.toFixed(2)}%</b>
                    </span>

                    <span>
                        ⚪ Faltas:
                        <b>${porcentajeFalto.toFixed(2)}%</b>
                    </span>

                </div>

            </div>

            <h3 class="titulo-secciones">
                📚 RESUMEN POR GRADO Y SECCIÓN
            </h3>

            <div class="tabla-resumen">

                <table>

                    <thead>

                        <tr>

                            <th>Grado</th>
                            <th>Sección</th>
                            <th>Temprano</th>
                            <th>Tardanza</th>
                            <th>Demasiado tarde</th>
                            <th>Faltó</th>
                            <th>Total</th>

                        </tr>

                    </thead>

                    <tbody>
        `;

        Object.values(secciones)
            .sort((a, b) =>
                String(a.grado)
                    .localeCompare(String(b.grado)) ||
                String(a.seccion)
                    .localeCompare(String(b.seccion))
            )
            .forEach(seccion => {

                html += `

                    <tr>

                        <td>
                            ${seccion.grado}
                        </td>

                        <td>
                            <b>
                                ${seccion.seccion}
                            </b>
                        </td>

                        <td class="celda-temprano">
                            ${seccion.TEMPRANO}
                        </td>

                        <td class="celda-tardanza">
                            ${seccion.TARDANZA}
                        </td>

                        <td class="celda-demasiado">
                            ${seccion["DEMASIADO TARDE"]}
                        </td>

                        <td class="celda-falto">
                            ${seccion.FALTO}
                        </td>

                        <td>
                            <b>
                                ${seccion.total}
                            </b>
                        </td>

                    </tr>

                `;
            });

        html += `

                    </tbody>

                </table>

            </div>

            <h3 class="titulo-secciones">
                👥 DETALLE DE ESTUDIANTES POR ESTADO
            </h3>

            <div class="detalle-estados">

        `;

        estados.forEach(estado => {

            const lista =
                personas[estado];

            let titulo =
                estado;

            if (estado === "FALTO") {
                titulo = "FALTARON";
            }

            html += `

                <details class="detalle-estado">

                    <summary>

                        ${titulo}

                        <span>
                            ${lista.length}
                        </span>

                    </summary>

                    <div class="lista-personas">

            `;

            if (!lista.length) {

                html += `

                    <p>
                        No hay estudiantes en este estado.
                    </p>

                `;

            } else {

                const listaOrdenada = [...lista].sort((a, b) =>
                    String(a.grado).localeCompare(String(b.grado)) ||
                    String(a.seccion).localeCompare(String(b.seccion)) ||
                    String(a.nombre).localeCompare(String(b.nombre))
                );

                let claveSeccionAnterior = null;

                listaOrdenada.forEach(persona => {

                    const claveSeccionActual =
                        `${persona.grado}|${persona.seccion}`;

                    if (claveSeccionActual !== claveSeccionAnterior) {

                        claveSeccionAnterior = claveSeccionActual;

                        const cantidadEnSeccion =
                            secciones[claveSeccionActual]
                                ? secciones[claveSeccionActual][estado]
                                : listaOrdenada.filter(p =>
                                    `${p.grado}|${p.seccion}` === claveSeccionActual
                                  ).length;

                        html += `
                            <div style="
                                margin:14px 0 6px;
                                padding:6px 10px;
                                background:#e0e7ff;
                                border-radius:6px;
                                font-weight:700;
                                color:#1d4ed8;
                            ">
                                ${persona.grado} ${persona.seccion}
                                (${cantidadEnSeccion})
                            </div>
                        `;
                    }

                    html += `

                        <div class="persona">

                            <b>
                                ${persona.nombre}
                            </b>

                            <span>
                                DNI: ${persona.dni}
                                —
                                ${persona.grado}
                                ${persona.seccion}
                                —
                                ${persona.fecha}
                            </span>

                        </div>

                    `;
                });
            }

            html += `

                    </div>

                </details>

            `;
        });

        html += `

            </div>

        </div>

        `;

        contenedor.innerHTML =
            html;

    } catch (error) {

        console.error(
            "Error al generar resumen:",
            error
        );

        contenedor.innerHTML = `

            <div style="
                padding:20px;
                color:#dc2626;
                background:#fee2e2;
                border-radius:10px;
            ">

                <b>❌ Error al generar el resumen</b>

                <br><br>

                ${error.message}

            </div>

        `;
    }
}



// ==========================================
// INICIALIZAR RESUMEN
// ==========================================

document.addEventListener("DOMContentLoaded", () => {

    seleccionarPeriodo("mensual");

});

window.consultar = async function() {

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML =
        "⏳ Consultando asistencia...";

    try {

        const grado =
            document.getElementById("grado").value;

        const seccion =
            document.getElementById("seccion").value;

        const desde =
            document.getElementById("desde").value;

        const hasta =
            document.getElementById("hasta").value;

        const estado =
            document.getElementById("estado").value;

        const buscar =
            document.getElementById("buscar").value.trim();

        if (!grado || !seccion || !desde || !hasta) {

            resultado.innerHTML =
                "<p style='color:red'>⚠️ Selecciona grado, sección y las fechas.</p>";

            return;
        }

        // ==========================================
        // CONSULTAR ASISTENCIAS DEL RANGO
        // ==========================================

        let url =
            SUPABASE_URL +
            "/rest/v1/vista_asistencia?select=*";

        url +=
            "&grado=eq." +
            encodeURIComponent(grado);

        url +=
            "&seccion=eq." +
            encodeURIComponent(seccion);

        url +=
            "&fecha=gte." +
            encodeURIComponent(desde);

        url +=
            "&fecha=lte." +
            encodeURIComponent(hasta);

        const respuesta =
            await fetch(url, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }

            });

        if (!respuesta.ok) {

            const errorTexto =
                await respuesta.text();

            resultado.innerHTML =
                "<p style='color:red'><b>❌ Error de Supabase:</b><br>" +
                errorTexto +
                "</p>";

            return;
        }

        const asistencias = await respuesta.json();

        // ==========================================
        // OBTENER ESTUDIANTES DEL GRADO Y SECCIÓN
        // (DEDUPLICADOS POR DNI)
        // ==========================================

        let urlEstudiantes =
            SUPABASE_URL +
            "/rest/v1/estudiantes?select=*&grado=eq." +
            encodeURIComponent(grado) +
            "&seccion=eq." +
            encodeURIComponent(seccion) +
            "&order=orden.asc";

        const respuestaEstudiantes = await fetch(urlEstudiantes, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        });

        const estudiantesRaw = await respuestaEstudiantes.json();

        let estudiantes =
            deduplicarEstudiantesPorDni(estudiantesRaw);

        const estudiantesMostrar = buscar
            ? estudiantes.filter(estudiante =>
                String(estudiante.dni).trim() === String(buscar).trim()
              )
            : estudiantes;

        // ==========================================
        // FECHAS LECTIVAS DEL RANGO
        // (misma función que usa el resumen)
        // ==========================================

        const fechasLectivas =
            generarFechasLectivas(desde, hasta);

        const dias = [
            "domingo",
            "lunes",
            "martes",
            "miércoles",
            "jueves",
            "viernes",
            "sábado"
        ];

        // ==========================================
        // MAPA ÚNICO dni|fecha -> registro
        // ==========================================

        const asistenciaPorClave = new Map();

        asistencias.forEach(registro => {

            const dni =
                String(registro.dni || "").trim();

            const fecha =
                String(registro.fecha || "")
                    .substring(0, 10);

            if (!dni || !fecha) return;

            const clave = dni + "|" + fecha;

            if (!asistenciaPorClave.has(clave)) {
                asistenciaPorClave.set(clave, registro);
            }
        });

        // ==========================================
        // UN REGISTRO POR ESTUDIANTE x FECHA LECTIVA
        // (misma fuente única de verdad que el resumen)
        // ==========================================

        const datos = [];

        estudiantesMostrar.forEach(estudiante => {

            const dni =
                String(estudiante.dni || "").trim();

            fechasLectivas.forEach(fecha => {

                const clave = dni + "|" + fecha;
                const registro = asistenciaPorClave.get(clave);

                const fechaObj =
                    new Date(fecha + "T12:00:00");

                datos.push({
                    grado: estudiante.grado,
                    seccion: estudiante.seccion,
                    orden: estudiante.orden,
                    nombre: estudiante.nombre,
                    dni: estudiante.dni,
                    fecha: fecha,
                    dia: dias[fechaObj.getDay()],
                    hora: registro ? (registro.hora || "") : "",
                    estado: registro
                        ? String(registro.estado || "").trim().toUpperCase()
                        : "FALTO"
                });
            });
        });

        // ==========================================
        // ORDENAR Y FILTRAR POR ESTADO
        // ==========================================

        datos.sort((a, b) => {
            return String(a.fecha).localeCompare(String(b.fecha)) ||
                   Number(a.orden || 0) - Number(b.orden || 0);
        });

        const datosFiltrados = estado
            ? datos.filter(e => e.estado === estado)
            : datos;

        datosActuales = datosFiltrados;

        mostrar(datosActuales);

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
            "<p style='color:red'><b>❌ Error:</b><br>" +
            error.message +
            "</p>";
    }
}

function mostrar(datos) {

    const resultado =
        document.getElementById("resultado");

    if (!datos.length) {

        resultado.innerHTML =
            "<p>❌ No se encontraron registros.</p>";

        return;
    }

    let html = `
    <div class="tabla">

    <table>

    <thead>

    <tr>
        <th>Grado</th>
        <th>Sección</th>
        <th>Orden</th>
        <th>Apellidos y nombres</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>
    `;

    datos.forEach(e => {

        let clase = "";

        if (e.estado === "TEMPRANO")
            clase = "temprano";

        if (e.estado === "TARDANZA")
            clase = "tardanza";

        if (e.estado === "DEMASIADO TARDE")
            clase = "demasiado";

        if (e.estado === "FALTO")
            clase = "falto";

        html += `
        <tr>

            <td>${e.grado ?? ""}</td>

            <td>${e.seccion ?? ""}</td>

            <td>${e.orden ?? ""}</td>

            <td>${e.nombre ?? ""}</td>

            <td>${e.dni ?? ""}</td>

            <td>${e.fecha ?? ""}</td>

            <td>${e.dia ?? ""}</td>

            <td>${e.hora ?? ""}</td>

            <td class="${clase}">
                ${e.estado ?? ""}
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>

    </div>

    <p>
        <b>Total:</b> ${datos.length} registros
    </p>
    `;

    resultado.innerHTML = html;
}

function descargar() {

    if (!datosActuales.length) {

        alert("Primero realiza una consulta.");

        return;
    }

    let csv =
        "Grado,Sección,Orden,Apellidos y nombres,DNI,Fecha,Día,Hora,Estado\n";

    datosActuales.forEach(e => {

        csv += [
            e.grado,
            e.seccion,
            e.orden,
            `"${e.nombre}"`,
            e.dni,
            e.fecha,
            e.dia,
            e.hora,
            e.estado
        ].join(",") + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "reporte_asistencia.csv";

    enlace.click();
}
